name: Avito profile — safe one-time report to GitHub
on:
  pull_request:
    paths:
      - 'tools/avito_profile_report_guard.py'
      - 'tests/test_avito_profile_report_guard.py'
      - '.github/workflows/avito-profile-report-once.yml'
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/avito-profile-report-once.yml'
  workflow_dispatch:
    inputs:
      approve_readonly:
        description: 'Authorize an Avito read-only inventory and a sanitized GitHub report'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: avito-profile-safe-report
  cancel-in-progress: false

jobs:
  offline_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Offline privacy guards and existing profile tests
        run: |
          python3 -m unittest discover -s tests -p 'test_avito_profile_report_guard.py' -v
          python3 -m unittest discover -s tests -p 'test_avito_profile_inventory.py' -v

  publish_redacted:
    needs: offline_tests
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'RUN_ONCE_AVITO_REDACTED_REPORT_PR19_2026_11_05')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.approve_readonly == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Obtain only safe Avito profile and category summary
        id: inventory
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          AVITO_ALLOW_PROFILE_INVENTORY: 'YES'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == 'push' && "$(date -u +%F)" != '2026-11-05' ]]; then
            echo "ONE_SHOT_DATE_EXPIRED_NO_REQUEST"
            exit 0
          fi
          raw="$RUNNER_TEMP/avito-profile-raw.json"
          dest="docs/reports/avito-profile-inventory-2026-11-05.json"
          python3 tools/avito_profile_inventory.py --live --approve-readonly > "$raw"
          python3 tools/avito_profile_report_guard.py "$raw" "$dest"
          rm -f "$raw"
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Commit public redacted report only
        if: ${{ steps.inventory.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git add -- docs/reports/avito-profile-inventory-2026-11-05.json
          if git diff --cached --quiet; then
            echo "SAFE_REPORT_ALREADY_CURRENT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "report: update redacted Avito profile API capability snapshot"
          git push origin HEAD:main
          echo "SANITIZED_REPORT_PUBLISHED_TO_REPOSITORY"
