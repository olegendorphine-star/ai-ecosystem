name: FL-003 Yandex index fallback (2 bounded queries)

on:
  pull_request:
    paths:
      - 'tools/fl003_yandex_marketplace_search.py'
      - '.github/workflows/fl003-yandex-marketplace-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  search_index:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate parser and allowlist without external requests
        run: |
          set -euo pipefail
          python3 -m py_compile tools/fl003_yandex_marketplace_search.py
          python3 tools/fl003_yandex_marketplace_search.py --dry-run
      - name: Search Ozon and Avito with existing Yandex secret; keep results source-labeled
        env:
          YANDEX_FL003_API_KEY: ${{ secrets.YANDEX_FL003_WEBSEARCH_API_KEY || secrets.yandex_api }}
          YANDEX_FL003_FOLDER_ID: b1ga59a6ib54m2km5cgd
        run: |
          set -euo pipefail
          python3 tools/fl003_yandex_marketplace_search.py --out "$RUNNER_TEMP/fl003-yandex-index.json"
          test -s "$RUNNER_TEMP/fl003-yandex-index.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fl003-yandex-index-unverified-candidates
          path: ${{ runner.temp }}/fl003-yandex-index.json
          retention-days: 7
          if-no-files-found: error
