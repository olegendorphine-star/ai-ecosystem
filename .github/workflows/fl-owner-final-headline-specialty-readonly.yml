name: FL - Verify exact owner headline and specialties read only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fl-owner-final-headline-specialty-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m py_compile tools/fl_owner_final_headline_specialty_readonly_20261109.py
      - name: Check owner headline and specialties by authorized VPS
        env:
          KEY_B64: ${{ secrets.AVITO_SERVER_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.AVITO_SERVER_KNOWN_HOSTS }}
          HOST: ${{ secrets.AVITO_SERVER_HOST }}
          USER: ${{ secrets.AVITO_SERVER_USER }}
          PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/fl-ssh"
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/fl-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/fl-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/fl-ssh/key" "$RUNNER_TEMP/fl-ssh/known_hosts"
          port="${PORT:-22}"
          report="$(cat tools/fl_owner_final_headline_specialty_readonly_20261109.py | ssh -F /dev/null -4 -T \
            -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/fl-ssh/known_hosts" \
            -o IdentitiesOnly=yes -o LogLevel=ERROR \
            -i "$RUNNER_TEMP/fl-ssh/key" -p "$port" "$USER@$HOST" \
            'env LD_LIBRARY_PATH="$HOME/.local/usr/lib/x86_64-linux-gnu:$HOME/.local/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" "$HOME/.avito-agent/venv/bin/python" -')"
          printf '%s\n' "$report" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          assert d["schema"]=="fl.owner.final.headline.specialization.readonly.v1" and d["owner"]
          assert d["no_writes"] and d["no_messages"] and d["no_payments"]
          print("FL_FINAL_HEADLINE",d["headline_exact_target"],d["headline_length"])
          print("FL_FINAL_DISPLAY_NAME",d["name_set"],d["surname_set"])
          for k in ("specializations","portfolio_sections","profile"):print("FL_FINAL_SPECIALTY_VIEW",k,json.dumps(d.get(k,{}),ensure_ascii=False))
          '

# One-time owner-triggered independent verification of revised title, 2026-11-10.
