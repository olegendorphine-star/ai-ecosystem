name: Avito server handoff — offline readiness tests

on:
  pull_request:
    paths:
      - 'tools/avito_server_worker.py'
      - 'tools/avito_server_bridge_client.py'
      - 'tests/test_avito_server_worker.py'
      - '.github/workflows/avito-server-bridge-probe.yml'
      - '.github/workflows/avito-server-handoff-readiness-offline.yml'
  push:
    branches: [main]
    paths:
      - 'tools/avito_server_worker.py'
      - 'tools/avito_server_bridge_client.py'
      - 'tests/test_avito_server_worker.py'
      - '.github/workflows/avito-server-handoff-readiness-offline.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile diagnostics
        run: |
          python3 -m py_compile tools/avito_server_worker.py tools/avito_server_bridge_client.py
      - name: Unit tests (no VPS, no browser, no cookies)
        run: |
          python3 -m unittest discover -s tests -p 'test_avito_server_worker.py' -v
