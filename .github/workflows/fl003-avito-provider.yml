name: FL-003 Avito provider adapter — zero-cost offline acceptance
on:
  pull_request:
    paths:
      - 'tools/fl003_avito_apish.py'
      - '.github/workflows/fl003-avito-provider.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test provider schema and prove no network or charge without explicit activation
        env:
          FL003_APISH_KEY: ""
          FL003_APISH_ENABLED: "0"
        run: |
          set -euo pipefail
          python3 -m py_compile tools/fl003_avito_apish.py
          python3 tools/fl003_avito_apish.py --selftest
          python3 tools/fl003_avito_apish.py --out "$RUNNER_TEMP/fl003-provider-disabled.json"
          python3 - "$RUNNER_TEMP/fl003-provider-disabled.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf-8"))
          assert d["status"]=="disabled_no_approved_access"
          assert d["outbound_requests"]==0 and d["listings"]==[]
          print("AVITO_PROVIDER_NO_PAID_CALLS_NO_USER_INTERACTION")
          PY
