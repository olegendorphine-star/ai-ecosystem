name: Avito approved listing - one-time read-only comparison
on:
  push:
    branches:
      - feature/avito-approved-ad-compare-2026-11-05
    paths:
      - .github/workflows/avito-approved-ad-compare-once.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Syntax check and offline guard
        run: |
          python3 -m py_compile tools/avito_approved_ad_compare.py
          python3 tools/avito_approved_ad_compare.py
      - name: Inspect listing read-only
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          AVITO_APPROVED_AD_READONLY: "YES"
        run: python3 tools/avito_approved_ad_compare.py
