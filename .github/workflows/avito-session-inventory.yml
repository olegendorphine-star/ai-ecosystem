name: Avito — private read-only session inventory

on:
  pull_request:
    paths:
      - 'tools/avito_session_inventory.py'
      - 'tests/test_avito_session_inventory.py'
      - '.github/workflows/avito-session-inventory.yml'
  push:
    branches: [main]
    paths:
      - 'tools/avito_session_inventory.py'
      - 'tests/test_avito_session_inventory.py'
      - '.github/workflows/avito-session-inventory.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Offline session privacy checks
        run: |
          python3 -m py_compile tools/avito_session_inventory.py
          python3 -m unittest discover -s tests -p 'test_avito_session_inventory.py' -v

  private_inventory:
    needs: offline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare pinned SSH key
        env:
          KEY_B64: ${{ secrets.AVITO_SERVER_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.AVITO_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$KEY_B64"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/avito-ssh"
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/avito-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/avito-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/avito-ssh/key" "$RUNNER_TEMP/avito-ssh/known_hosts"
      - name: Check session persistence without reading account content
        env:
          AVITO_SERVER_HOST: ${{ secrets.AVITO_SERVER_HOST }}
          AVITO_SERVER_USER: ${{ secrets.AVITO_SERVER_USER }}
          AVITO_SERVER_PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${AVITO_SERVER_PORT:-22}"
          report="$(cat tools/avito_session_inventory.py | ssh -F /dev/null -4 -T \
            -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/avito-ssh/known_hosts" \
            -o IdentitiesOnly=yes -i "$RUNNER_TEMP/avito-ssh/key" -p "$port" \
            "$AVITO_SERVER_USER@$AVITO_SERVER_HOST" 'python3 -')" 
          printf '%s\n' "$report" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("schema")=="avito.session.inventory.v1" and d.get("write_actions") is False; print(json.dumps(d,sort_keys=True))'
