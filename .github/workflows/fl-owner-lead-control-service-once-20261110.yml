name: FL - owner publish 30k lead-control service once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fl-owner-lead-control-service-once-20261110.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fl-owner-lead-control-service-20261110
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate file
        run: python3 -m py_compile tools/fl_owner_publish_leadtrack_service_once_20261110.py
      - name: Prepare verified owner VPS SSH
        env:
          KEY_B64: ${{ secrets.AVITO_SERVER_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.AVITO_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$KEY_B64" && test -n "$KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/fl-ssh"
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/fl-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/fl-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/fl-ssh/key" "$RUNNER_TEMP/fl-ssh/known_hosts"
      - name: Publish exactly one new own FL service, never pay or message
        env:
          HOST: ${{ secrets.AVITO_SERVER_HOST }}
          USER: ${{ secrets.AVITO_SERVER_USER }}
          PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${PORT:-22}"
          report="$(cat tools/fl_owner_publish_leadtrack_service_once_20261110.py | ssh -F /dev/null -4 -T \
            -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/fl-ssh/known_hosts" \
            -o IdentitiesOnly=yes -o LogLevel=ERROR \
            -i "$RUNNER_TEMP/fl-ssh/key" -p "$port" "$USER@$HOST" \
            'env LD_LIBRARY_PATH="$HOME/.local/usr/lib/x86_64-linux-gnu:$HOME/.local/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" "$HOME/.avito-agent/venv/bin/python" -')"
          printf '%s\n' "$report" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          assert d["schema"]=="fl.owner.services.leadtrack.cover.v1"
          for k in ("payment_performed","other_profile_changed","captcha_interacted"):assert d[k] is False
          print("FL_NEW_SERVICE_OWNER",d["owner"])
          for s in d["results"]:
             print("FL_NEW_SERVICE",s["id"],s["result"],s.get("stage"),s["clicked_publish"],s["verified"])
          assert d["owner"] is True and all(x["verified"] for x in d["results"])
          '
