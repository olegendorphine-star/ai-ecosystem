name: Import approved Avito photographs (temporary one-shot)
on:
  push:
    branches: [ "fix/avito-publish-images-2026-11-05" ]
permissions:
  contents: write
jobs:
  import_images:
    if: ${{ !contains(github.event.head_commit.message, '[photos-committed]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Transfer only approved advertising files and verify byte hashes
        env:
          PHOTO_1: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-d55c-81f4-bee8-211ce87458d1/raw?se=2026-11-05T06%3A58%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=851852ec-19dd-52cf-adf7-514631292090&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-05T04%3A48%3A19Z&ske=2026-11-06T04%3A48%3A19Z&sks=b&skv=2026-02-06&sig=7BUqbHoS6/2i7IqI61sOQAdOVk2to%2B96XNa3gX8/lsE%3D"
          PHOTO_2: "https://sdmntprukwest.oaiusercontent.com/files/00000000-8c30-8243-b06d-0d777f9eeee1/raw?se=2026-11-05T06%3A58%3A15Z&sp=r&sv=2026-02-06&sr=b&scid=c3d936f5-5fef-55e8-9698-a09c9e8619fb&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-05T05%3A41%3A40Z&ske=2026-11-06T05%3A41%3A40Z&sks=b&skv=2026-02-06&sig=yXeTu4LLYpiEBqBHKkv/DbMeePYZAGQzagG0fyMfslA%3D"
          PHOTO_3: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-e838-8210-b548-ecaac6968cf9/raw?se=2026-11-05T06%3A58%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=fd9182d1-7273-5b06-aeee-406cd8a3a0d2&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-05T03%3A01%3A36Z&ske=2026-11-06T03%3A01%3A36Z&sks=b&skv=2026-02-06&sig=%2BAvo8R9T9cxl/WFwBWllBdyS9NfekAHMj%2BnMMMyGCfs%3D"
          PHOTO_4: "https://sdmntprnortheu.oaiusercontent.com/files/00000000-7ef8-81f4-b113-5bd54e12e6a5/raw?se=2026-11-05T06%3A58%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=288df82a-e0ca-5d6c-9c7f-6bdd7440ddbe&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-05T06%3A07%3A33Z&ske=2026-11-06T06%3A07%3A33Z&sks=b&skv=2026-02-06&sig=nlQStB6QD6W%2BgDkM1zrSSWzCD11RUjlThy8vlIG6y/M%3D"
          PHOTO_5: "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-d4d8-8210-9785-ab1bc18109ca/raw?se=2026-11-05T06%3A58%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=0fe503b9-d30b-5b5c-8bed-f628441f3058&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-05T05%3A41%3A40Z&ske=2026-11-06T05%3A41%3A40Z&sks=b&skv=2026-02-06&sig=fk3JdYHDr3VXReZypd/J4UshYO7GbriEUh1HxxNXGTs%3D"
          PHOTO_6: "https://sdmntprukwest.oaiusercontent.com/files/00000000-c2c8-8243-a07a-b7f0f7e5424f/raw?se=2026-11-05T06%3A58%3A18Z&sp=r&sv=2026-02-06&sr=b&scid=9b55521f-81a4-526c-a25f-eccfbb0de5f6&skoid=a0b9f82a-c86e-4064-a822-2aa38890bb37&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-05T03%3A55%3A46Z&ske=2026-11-06T03%3A55%3A46Z&sks=b&skv=2026-02-06&sig=k9txKv4EM%2BttIk1I0usgds9RWmcdA/DGWi3KLGtE7c8%3D"
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,hashlib,pathlib,urllib.request
          names=["01_cover.png","02_audit.jpg","03_assistant.png","04_business.png","05_how_it_works.png","06_results.png"]
          hashes=["b71429da9c2157c18ee9e17526a80c11081cff983c2f9e1b0726e15004fc2f0c","cae6898bcdc351598b8545b8e49b5a605d126e437c9817450e3b8df3e5ae786d","4b9c7453104861e6ce5646739121e156cb646f9c84b4200fb75d5afbef60cbb8","8f3a5cac5fdd8a5d82025e48c9e3d26ea01edf61f3c5a9ea4bc9e17e9ca83fed","de1d4046fef909bb06b12a214c70c40144408a03267e1d2eb1e79cfaf77747e2","23510a3802fb5dd005125d7a07957551f513062684ead776b0477ec7efc14300"]
          folder=pathlib.Path('docs/images/avito')
          folder.mkdir(parents=True,exist_ok=True)
          for i,(name,digest) in enumerate(zip(names,hashes),1):
              try:
                  with urllib.request.urlopen(os.environ['PHOTO_'+str(i)],timeout=55) as resp:
                      data=resp.read()
              except Exception as exc:
                  print('image_download_failed',i,type(exc).__name__,getattr(exc,'code',''))
                  raise SystemExit(1)
              actual=hashlib.sha256(data).hexdigest()
              if actual != digest:
                  print('image_hash_mismatch',i,len(data))
                  raise SystemExit(2)
              if not (data.startswith(b'\x89PNG\r\n\x1a\n') or data.startswith(b'\xff\xd8\xff')):
                  print('image_format_invalid',i)
                  raise SystemExit(3)
              (folder/name).write_bytes(data)
              print('verified_original',i,name,'bytes',len(data),'sha256',digest[:12])
          PY
          git add docs/images/avito
          git rm -- .github/workflows/avito-import-original-photos.yml
          git -c user.name="avito-asset-import" -c user.email="actions@users.noreply.github.com" commit -m "Publish six hash-verified Avito source photos [photos-committed]"
          git push origin HEAD:fix/avito-publish-images-2026-11-05
