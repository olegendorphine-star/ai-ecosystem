name: Telegram - check Docker and WARP feasibility on existing VPS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/telegram-warp-capability.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Pinned SSH setup
        env:
          KEY: ${{ secrets.AVITO_SERVER_SSH_KEY_B64 }}
          KH: ${{ secrets.AVITO_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/tg-ssh"
          printf '%s' "$KEY" | base64 -d > "$RUNNER_TEMP/tg-ssh/key"
          printf '%s\n' "$KH" > "$RUNNER_TEMP/tg-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/tg-ssh/key" "$RUNNER_TEMP/tg-ssh/known_hosts"
      - name: Check capabilities without changing system
        env:
          HOST: ${{ secrets.AVITO_SERVER_HOST }}
          USER: ${{ secrets.AVITO_SERVER_USER }}
          PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
        run: |
          set -euo pipefail
          ssh -F /dev/null -4 -T -o BatchMode=yes -o ConnectTimeout=15 \
          -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/tg-ssh/known_hosts" \
          -o IdentitiesOnly=yes -o LogLevel=ERROR \
          -i "$RUNNER_TEMP/tg-ssh/key" -p "${PORT:-22}" "$USER@$HOST" 'python3 -' <<'PY'
          import json,subprocess,socket
          from pathlib import Path
          out={"schema":"tg.warp.capabilities.v1","read_only":True}
          def check(args,timeout=7):
              try:
                  z=subprocess.run(args,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=timeout,check=False)
                  return z.returncode==0
              except (OSError,subprocess.TimeoutExpired):
                  return False
          out["docker_daemon_usable"]=check(["docker","info","--format","{{.ServerVersion}}"])
          out["sudo_noninteractive"]=check(["sudo","-n","true"],2)
          out["systemd_user_available"]=check(["systemctl","--user","is-system-running"],3)
          out["user_crontab_present"]=check(["crontab","-l"],3)
          for host in ("ghcr.io","api.cloudflareclient.com"):
              try:
                  with socket.create_connection((host,443),timeout=4):
                      out[host+"_tcp443"]=True
              except OSError:
                  out[host+"_tcp443"]=False
          # Official Telegram DCs, for diagnosis only. Never send data.
          for name, ip in (("dc1","149.154.175.53"),("dc2","149.154.167.50"),("dc3","149.154.175.100")):
              try:
                  with socket.create_connection((ip,443),timeout=3):
                      out[name+"_tcp443"]=True
              except OSError:
                  out[name+"_tcp443"]=False
          print(json.dumps(out,sort_keys=True))
          PY
