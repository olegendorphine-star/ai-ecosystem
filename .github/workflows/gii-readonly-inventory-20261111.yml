name: Gii bounded read-only inventory 2026-11-11
on:
  push:
    branches: ["gii/read-only-inventory-20261111"]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read only fixed Gii paths and service state
        env:
          KEY_B64: ${{ secrets.AVITO_SERVER_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.AVITO_SERVER_KNOWN_HOSTS }}
          SERVER_HOST: ${{ secrets.AVITO_SERVER_HOST }}
          SERVER_USER: ${{ secrets.AVITO_SERVER_USER }}
          SERVER_PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
        run: |
          python3 - <<'PY'
          import os,base64,subprocess,sys
          root=os.environ["RUNNER_TEMP"]+"/gii-ro"
          os.makedirs(root,mode=0o700,exist_ok=True)
          key=root+"/key";known=root+"/known_hosts"
          for name,value in [(key,base64.b64decode(os.environ["KEY_B64"])),(known,os.environ["KNOWN_HOSTS"].encode())]:
           fd=os.open(name,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
           with os.fdopen(fd,"wb") as f:f.write(value)
          port=os.environ.get("SERVER_PORT") or "22"
          if not port.isdigit():raise SystemExit("invalid_port")
          cmd=["ssh","-F","/dev/null","-4","-T","-o","BatchMode=yes","-o","ConnectTimeout=15","-o","StrictHostKeyChecking=yes","-o","UserKnownHostsFile="+known,"-o","IdentitiesOnly=yes","-i",key,"-p",port,os.environ["SERVER_USER"]+"@"+os.environ["SERVER_HOST"],"python3 -"]
          try:
           r=subprocess.run(cmd,input="import os,json,stat,hashlib,datetime\nout={\"schema\":\"gii.server.source-readonly.v1\",\"at\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"files\":{}}\nroots=[\"/opt/gii-website\",\"/opt/gii-lab/releases/sonar-1.1/gii-website\",\"/opt/gii-sonar-staging/gii-website\"]\nfor root in roots:\n for name in [\"app.py\",\"sonar.py\",\"reliability.py\",\"SONAR_PROTOCOL.md\",\"manifest.json\"]:\n  p=root+\"/\"+name\n  try:\n   s=os.lstat(p)\n   if not stat.S_ISREG(s.st_mode):out[\"files\"][p]={\"status\":\"not_regular\"};continue\n   if s.st_size>2000000:out[\"files\"][p]={\"status\":\"too_large\"};continue\n   b=open(p,\"rb\").read()\n   out[\"files\"][p]={\"bytes\":len(b),\"sha256\":hashlib.sha256(b).hexdigest()}\n  except FileNotFoundError:out[\"files\"][p]={\"status\":\"absent\"}\n  except PermissionError:out[\"files\"][p]={\"status\":\"permission_denied\"}\nprint(json.dumps(out,ensure_ascii=False))\n",capture_output=True,text=True,timeout=70)
           print(r.stdout)
           if r.returncode:print("SSH_CONNECTION_FAILED",r.returncode)
           sys.exit(r.returncode)
          finally:
           os.unlink(key);os.unlink(known)
          
          PY
