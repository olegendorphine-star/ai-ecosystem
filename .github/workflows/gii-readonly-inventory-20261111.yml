name: Gii bounded read-only inventory 2026-11-11
on:
  push:
    branches: ["gii/read-only-inventory-20261111"]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read only fixed Gii paths and service state
        env:
          KEY_B64: ${{ secrets.AVITO_SERVER_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.AVITO_SERVER_KNOWN_HOSTS }}
          SERVER_HOST: ${{ secrets.AVITO_SERVER_HOST }}
          SERVER_USER: ${{ secrets.AVITO_SERVER_USER }}
          SERVER_PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
        run: |
          python3 - <<'PY'
          import os,base64,subprocess,sys
          root=os.environ["RUNNER_TEMP"]+"/gii-ro"
          os.makedirs(root,mode=0o700,exist_ok=True)
          key=root+"/key";known=root+"/known_hosts"
          for name,value in [(key,base64.b64decode(os.environ["KEY_B64"])),(known,os.environ["KNOWN_HOSTS"].encode())]:
           fd=os.open(name,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
           with os.fdopen(fd,"wb") as f:f.write(value)
          port=os.environ.get("SERVER_PORT") or "22"
          if not port.isdigit():raise SystemExit("invalid_port")
          cmd=["ssh","-F","/dev/null","-4","-T","-o","BatchMode=yes","-o","ConnectTimeout=15","-o","StrictHostKeyChecking=yes","-o","UserKnownHostsFile="+known,"-o","IdentitiesOnly=yes","-i",key,"-p",port,os.environ["SERVER_USER"]+"@"+os.environ["SERVER_HOST"],"python3 -"]
          try:
           r=subprocess.run(cmd,input="import os,json,stat,hashlib,subprocess,base64,datetime\nout={\"schema\":\"gii.server.encrypted-source.v1\",\"at\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"files\":{},\"unit_properties\":{}}\npaths=[\"/opt/gii-website/app.py\",\"/opt/gii-lab/releases/sonar-1.1/gii-website/app.py\",\"/opt/gii-lab/releases/sonar-1.1/gii-website/sonar.py\",\"/opt/gii-sonar-staging/gii-website/app.py\",\"/opt/gii-sonar-staging/gii-website/sonar.py\",\"/opt/gii-sonar-staging/gii-website/SONAR_PROTOCOL.md\",\"/opt/gii-sonar-staging/edge/gii_sonar_staging_edge.py\"]\nfor p in paths:\n try:\n  s=os.lstat(p)\n  if not stat.S_ISREG(s.st_mode) or s.st_size>500000:out[\"files\"][p]={\"status\":\"not_allowed\"};continue\n  b=open(p,\"rb\").read();out[\"files\"][p]={\"sha256\":hashlib.sha256(b).hexdigest(),\"content_b64\":base64.b64encode(b).decode()}\n except FileNotFoundError:out[\"files\"][p]={\"status\":\"absent\"}\n except PermissionError:out[\"files\"][p]={\"status\":\"permission_denied\"}\nfor u in [\"gii-web.service\",\"gii-sonar-staging.service\",\"gii-sonar-staging-edge.service\",\"gii-sonar-staging-tunnel.service\"]:\n r=subprocess.run([\"systemctl\",\"show\",u,\"--property=Id,ExecStart,EnvironmentFiles,ReadOnlyPaths,ReadWritePaths,ProtectSystem,NoNewPrivileges,MainPID\"],capture_output=True,text=True,timeout=5)\n out[\"unit_properties\"][u]=r.stdout\ncert=\"-----BEGIN CERTIFICATE-----\\nMIID3DCCAkSgAwIBAgIUGyvson6sP8LNFjE3Bx6xv8hoOAUwDQYJKoZIhvcNAQEL\\nBQAwKDEmMCQGA1UEAwwdR2lpIHJlYWQtb25seSBhdWRpdCB0cmFuc3BvcnQwHhcN\\nMjYxMTExMTAxMjE5WhcNMjYxMTEzMTAxNzE5WjAoMSYwJAYDVQQDDB1HaWkgcmVh\\nZC1vbmx5IGF1ZGl0IHRyYW5zcG9ydDCCAaIwDQYJKoZIhvcNAQEBBQADggGPADCC\\nAYoCggGBAJw7ZWjGdG1fuY8035y8QZe8xt/czlJc9ABYcvPtohKYxou7qavmoK8u\\nPUyPCg4Z5eV9ohjrSPrR85uTGPaaeNeAx+SeCvywlRqBZFH70mClIEMEbjJroOA2\\njmVc1zSh0TiJR3DxLAyI4JlXPFMBjXzyjymahBVqmKUXCFwxVeCFNIM7rt1XGLUR\\nt5uA3NZKsBqwd+ySAWDLqCfXM6RhilttZjX5tc+uW68ZbRu9zBdLPnHziOWA31WM\\ntNUtCXJvCRlDO0J3cgBikkLrDnzN51uXwCBxXD+KIM3REeOjresl7xKqXFfEzDjU\\nAVF+34h5oyVgaGUyHUHs6V5MiPmzECQxgNfg/XoOk4pmh5750EWCDcw7vLyfSlQY\\nG4z0r7djHRyoEQ1vJNxnu8mFi86rtB2Zogh7ZFSo0sjY83UsA+ncbanVsujs6t6+\\nF5VXiu0kHXKAgFkWbhDOgKYA2yXDdSmZqrpqjhmCh4DuelnmfjAtS3o0vO2FyypX\\nlJgynY8WSQIDAQABMA0GCSqGSIb3DQEBCwUAA4IBgQBm3OcquvnWo+1siMWj1qjK\\n0y9u5UABTYnuGM7HBNOZgFlhdzVeN/72Bgt0Xtxj/B7bOFujO6SsN8Dg+G51uiIS\\ni5kcbcuGDMYOcOtLnDf6qY2+toO0AcuckcBYz74IaRjabu94nFMnu4E8wsrM3JSz\\neMnli13NBr8oAJe65YBsaMxNqsFHcOJNzplVKaDupo2OeNcDLOai39YHWPU+3IlX\\n4y0E+N55hch0sui72foK4Fkoy+vLbluk4o7Y3Bp2u4DuwW22bCfw04w7LdzmDyev\\nuvXSTTpwozEzC6cJ2l6aslscvjyQ+juQ8mxLrgWc9PoQ4dRRu0fn7XR00kcMTIdZ\\nnHKSX/p5lAsk2mrw67ruRUv2/rpPQUd74TooaE37DLH3EsDSr6XBhI15oN4tp6w2\\n38Xtq2HH6i2Ed3OcN6ZnSrne5AyUoO07oCclF4OH+gimwH+j74iQ3N+Kk3dvjlkC\\n4NXs+M34gUkvYSTuBoodUukeEqFxR53AlpyZGVBeUnI=\\n-----END CERTIFICATE-----\"\nfd,w=os.pipe();os.write(w,cert.encode());os.close(w)\ntry:\n r=subprocess.run([\"openssl\",\"cms\",\"-encrypt\",\"-binary\",\"-outform\",\"DER\",\"-aes256\",\"/dev/fd/\"+str(fd)],input=json.dumps(out).encode(),capture_output=True,pass_fds=(fd,),timeout=15)\n if r.returncode:raise RuntimeError(\"encryption_failed\")\n print(json.dumps({\"schema\":\"gii.encrypted-transfer.v1\",\"ciphertext_b64\":base64.b64encode(r.stdout).decode(),\"ciphertext_sha256\":hashlib.sha256(r.stdout).hexdigest()}))\nfinally:os.close(fd)\n",capture_output=True,text=True,timeout=70)
           print(r.stdout)
           if r.returncode:print("SSH_CONNECTION_FAILED",r.returncode)
           sys.exit(r.returncode)
          finally:
           os.unlink(key);os.unlink(known)
          
          PY
