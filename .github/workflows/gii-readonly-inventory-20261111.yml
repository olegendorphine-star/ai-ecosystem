name: Gii bounded read-only inventory 2026-11-11
on:
  push:
    branches: ["gii/read-only-inventory-20261111"]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read only fixed Gii paths and service state
        env:
          KEY_B64: ${{ secrets.AVITO_SERVER_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.AVITO_SERVER_KNOWN_HOSTS }}
          SERVER_HOST: ${{ secrets.AVITO_SERVER_HOST }}
          SERVER_USER: ${{ secrets.AVITO_SERVER_USER }}
          SERVER_PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
        run: |
          python3 - <<'PY'
          import os,base64,subprocess,sys
          root=os.environ["RUNNER_TEMP"]+"/gii-ro"
          os.makedirs(root,mode=0o700,exist_ok=True)
          key=root+"/key";known=root+"/known_hosts"
          for name,value in [(key,base64.b64decode(os.environ["KEY_B64"])),(known,os.environ["KNOWN_HOSTS"].encode())]:
           fd=os.open(name,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
           with os.fdopen(fd,"wb") as f:f.write(value)
          port=os.environ.get("SERVER_PORT") or "22"
          if not port.isdigit():raise SystemExit("invalid_port")
          cmd=["ssh","-F","/dev/null","-4","-T","-o","BatchMode=yes","-o","ConnectTimeout=15","-o","StrictHostKeyChecking=yes","-o","UserKnownHostsFile="+known,"-o","IdentitiesOnly=yes","-i",key,"-p",port,os.environ["SERVER_USER"]+"@"+os.environ["SERVER_HOST"],"python3 -"]
          try:
           r=subprocess.run(cmd,input="import json,subprocess,shlex,datetime,os,stat\nout={\"schema\":\"gii.server.config-readonly.v1\",\"at\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"services\":{},\"release_files\":{}}\nfor u in [\"gii-web.service\",\"gii-lab.service\",\"gii-lab-edge.service\",\"gii-lab-tunnel.service\",\"gii-sonar-staging.service\",\"gii-sonar-staging-edge.service\",\"gii-sonar-staging-tunnel.service\"]:\n r=subprocess.run([\"systemctl\",\"show\",u,\"--property=WorkingDirectory,User,ExecStart,Environment,ActiveState\"],capture_output=True,text=True,timeout=5)\n d={}\n for line in r.stdout.splitlines():\n  k,_,v=line.partition(\"=\")\n  if k==\"Environment\":\n   try:d[\"allowed_environment\"]={x.split(\"=\",1)[0]:x.split(\"=\",1)[1] for x in shlex.split(v) if \"=\" in x and x.split(\"=\",1)[0] in (\"GII_DATA\",\"GII_BASE_URL\")}\n   except ValueError:d[\"allowed_environment\"]={\"error\":\"parse_failed\"}\n  else:d[k]=v\n out[\"services\"][u]=d\nfor p in [\"/opt/gii-sonar-staging/release\",\"/opt/gii-sonar-staging/manifest.json\",\"/opt/gii-sonar-staging/SHA256SUMS\"]:\n try:\n  s=os.lstat(p)\n  if stat.S_ISDIR(s.st_mode):out[\"release_files\"][p]={\"names\":sorted(os.listdir(p))[:100]}\n  else:out[\"release_files\"][p]={\"bytes\":s.st_size}\n except FileNotFoundError:out[\"release_files\"][p]={\"status\":\"absent\"}\n except PermissionError:out[\"release_files\"][p]={\"status\":\"permission_denied\"}\nr=subprocess.run([\"systemctl\",\"list-timers\",\"--all\",\"--no-legend\",\"gii*\"],capture_output=True,text=True,timeout=5);out[\"gii_timers\"]=r.stdout\nprint(json.dumps(out,ensure_ascii=False))\n",capture_output=True,text=True,timeout=70)
           print(r.stdout)
           if r.returncode:print("SSH_CONNECTION_FAILED",r.returncode)
           sys.exit(r.returncode)
          finally:
           os.unlink(key);os.unlink(known)
          
          PY
