name: Gii bounded read-only inventory 2026-11-11
on:
  push:
    branches: ["gii/read-only-inventory-20261111"]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read only fixed Gii paths and service state
        env:
          KEY_B64: ${{ secrets.AVITO_SERVER_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.AVITO_SERVER_KNOWN_HOSTS }}
          SERVER_HOST: ${{ secrets.AVITO_SERVER_HOST }}
          SERVER_USER: ${{ secrets.AVITO_SERVER_USER }}
          SERVER_PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
        run: |
          python3 - <<'PY'
          import os,base64,subprocess,sys
          root=os.environ["RUNNER_TEMP"]+"/gii-ro"
          os.makedirs(root,mode=0o700,exist_ok=True)
          key=root+"/key";known=root+"/known_hosts"
          for name,value in [(key,base64.b64decode(os.environ["KEY_B64"])),(known,os.environ["KNOWN_HOSTS"].encode())]:
           fd=os.open(name,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
           with os.fdopen(fd,"wb") as f:f.write(value)
          port=os.environ.get("SERVER_PORT") or "22"
          if not port.isdigit():raise SystemExit("invalid_port")
          cmd=["ssh","-F","/dev/null","-4","-T","-o","BatchMode=yes","-o","ConnectTimeout=15","-o","StrictHostKeyChecking=yes","-o","UserKnownHostsFile="+known,"-o","IdentitiesOnly=yes","-i",key,"-p",port,os.environ["SERVER_USER"]+"@"+os.environ["SERVER_HOST"],"python3 -"]
          try:
           r=subprocess.run(cmd,input="import json,urllib.request,urllib.error,datetime,subprocess\nout={\"schema\":\"gii.server.readonly-routes.v1\",\"at\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"requests\":[]}\nurls=[\"http://127.0.0.1:20242/quicktunnel\",\"http://127.0.0.1:18768/\",\"http://127.0.0.1:18768/sonar/tasks\",\"http://127.0.0.1:18768/admin\",\"http://127.0.0.1:18768/evaluator/tasks.json\",\"http://127.0.0.1:18768/static/../evaluator/tasks.json\"]\nfor u in urls:\n row={\"url\":u}\n try:\n  with urllib.request.urlopen(u,timeout=5) as r:\n   b=r.read(100000);row[\"status\"]=r.status\n   try:\n    j=json.loads(b)\n    if \"/sonar/tasks\" in u:row.update({\"count\":j.get(\"count\"),\"schema\":j.get(\"schema\"),\"task_fields\":sorted(set().union(*(t.keys() for t in j.get(\"tasks\",[]))))})\n    else:row[\"json\"]=j\n   except Exception:row[\"body_bytes\"]=len(b)\n except urllib.error.HTTPError as e:row[\"status\"]=e.code\n except Exception as e:row[\"error\"]=type(e).__name__\n out[\"requests\"].append(row)\nr=subprocess.run([\"systemctl\",\"list-units\",\"--all\",\"--plain\",\"--no-legend\",\"gii*\"],capture_output=True,text=True,timeout=5);out[\"gii_units\"]=r.stdout\nprint(json.dumps(out,ensure_ascii=False))\n",capture_output=True,text=True,timeout=70)
           print(r.stdout)
 if r.returncode==0:
  import json,urllib.request,urllib.error,datetime
  report=json.loads(r.stdout);hostname=report["requests"][0].get("json",{}).get("hostname","")
  if not hostname.endswith(".trycloudflare.com") or "/" in hostname:raise SystemExit("invalid_tunnel_hostname")
  external={"schema":"gii.external-runner-readonly.v1","at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"base_url":"https://"+hostname,"client":"GitHub hosted runner, outside VPS","results":[]}
  for path in ["/health","/sonar/tasks","/admin","/evaluator/tasks.json"]:
   item={"path":path}
   try:
    with urllib.request.urlopen(external["base_url"]+path,timeout=12) as response:
     raw=response.read(100000);item["status"]=response.status
     try:
      data=json.loads(raw)
      if path=="/sonar/tasks":item.update(count=data.get("count"),schema=data.get("schema"),task_fields=sorted(set().union(*(t.keys() for t in data.get("tasks",[])))))
      elif path=="/health":item["json"]=data
     except ValueError:item["body_bytes"]=len(raw)
   except urllib.error.HTTPError as error:item["status"]=error.code
   except Exception as error:item["error"]=type(error).__name__
   external["results"].append(item)
  print(json.dumps(external))
           if r.returncode:print("SSH_CONNECTION_FAILED",r.returncode)
           sys.exit(r.returncode)
          finally:
           os.unlink(key);os.unlink(known)
          
          PY
