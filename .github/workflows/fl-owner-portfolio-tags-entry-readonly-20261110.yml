name: FL - owner portfolio tag edit UI preflight 20261110
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fl-owner-portfolio-tags-entry-readonly-20261110.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m py_compile tools/fl_owner_portfolio_tags_entry_readonly_20261110.py
      - name: Inspect own public portfolio editing entrypoints only
        env:
          KEY_B64: ${{ secrets.AVITO_SERVER_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.AVITO_SERVER_KNOWN_HOSTS }}
          HOST: ${{ secrets.AVITO_SERVER_HOST }}
          USER: ${{ secrets.AVITO_SERVER_USER }}
          PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/fl-ssh"
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/fl-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/fl-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/fl-ssh/key" "$RUNNER_TEMP/fl-ssh/known_hosts"
          port="${PORT:-22}"
          report="$(cat tools/fl_owner_portfolio_tags_entry_readonly_20261110.py | ssh -F /dev/null -4 -T \
            -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/fl-ssh/known_hosts" \
            -o IdentitiesOnly=yes -o LogLevel=ERROR \
            -i "$RUNNER_TEMP/fl-ssh/key" -p "$port" "$USER@$HOST" \
            'env LD_LIBRARY_PATH="$HOME/.local/usr/lib/x86_64-linux-gnu:$HOME/.local/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" "$HOME/.avito-agent/venv/bin/python" -')"
          printf '%s\n' "$report" | python3 -c '
          import sys,json
          d=json.load(sys.stdin)
          assert d["schema"]=="fl.owner.portfolio.tags.entry.readonly.v1"
          assert d["owner"] and d["read_only"] and not d["payments"] and not d["write"]
          for x in d["sections"]: print("FL_SECTION_EDIT",json.dumps(x,ensure_ascii=False))
          print("FL_EDIT_MODAL",json.dumps(d.get("modal",{}),ensure_ascii=False))
          '

# Owner asked for tag editor mapping; one more read-only preflight.

# Confirm asynchronous keyword form before writing any tag.

# Read-only active keyword field and modal save control probe.
