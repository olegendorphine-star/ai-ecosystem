name: Avito server bridge — read-only probe

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Fixed read-only probe"
        required: true
        type: choice
        options:
          - health
          - browser_health
          - connect_status

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare SSH files
        env:
          SERVER_KEY_B64: ${{ secrets.AVITO_SERVER_SSH_KEY_B64 }}
          SERVER_KNOWN_HOSTS: ${{ secrets.AVITO_SERVER_KNOWN_HOSTS }}
        run: |
          test -n "$SERVER_KEY_B64"
          test -n "$SERVER_KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/avito-ssh"
          printf '%s' "$SERVER_KEY_B64" | base64 --decode > "$RUNNER_TEMP/avito-ssh/avito_server_ed25519"
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$RUNNER_TEMP/avito-ssh/avito_server_known_hosts"
          chmod 600 "$RUNNER_TEMP/avito-ssh/avito_server_ed25519" "$RUNNER_TEMP/avito-ssh/avito_server_known_hosts"
      - name: Run fixed server probe
        env:
          AVITO_SERVER_HOST: ${{ secrets.AVITO_SERVER_HOST }}
          AVITO_SERVER_USER: ${{ secrets.AVITO_SERVER_USER }}
          AVITO_SERVER_SSH_PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
          AVITO_SERVER_SSH_KEY_FILE: "${{ runner.temp }}/avito-ssh/avito_server_ed25519"
          AVITO_SERVER_KNOWN_HOSTS_FILE: "${{ runner.temp }}/avito-ssh/avito_server_known_hosts"
        run: |
          test -n "$AVITO_SERVER_HOST"
          test -n "$AVITO_SERVER_USER"
          python3 tools/avito_server_bridge_client.py --action "${{ inputs.action }}"
