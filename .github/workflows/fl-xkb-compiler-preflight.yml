name: FL.ru — private XKB compiler execution diagnosis

on:
  pull_request:
    paths:
      - 'tools/fl_xkb_compiler_preflight.py'
      - '.github/workflows/fl-xkb-compiler-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'tools/fl_xkb_compiler_preflight.py'
      - '.github/workflows/fl-xkb-compiler-preflight.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Syntax and safe category tests
        run: |
          set -euo pipefail
          python3 -m py_compile tools/fl_xkb_compiler_preflight.py
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "tools")
          from fl_xkb_compiler_preflight import classify
          assert classify("libxkbfile.so.1: cannot open shared libraries") == ["xkb_library_missing"]
          assert classify("SECRETPASSWORD") == []
          print("FL_XKB_DIAGNOSTIC_OFFLINE_OK")
          PY
  private:
    needs: offline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare pinned SSH
        env:
          KEY_B64: ${{ secrets.AVITO_SERVER_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.AVITO_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/fl-ssh"
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/fl-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/fl-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/fl-ssh/key" "$RUNNER_TEMP/fl-ssh/known_hosts"
      - name: Test local xkbcomp and Xvfb keymap capabilities without browser
        env:
          HOST: ${{ secrets.AVITO_SERVER_HOST }}
          USER: ${{ secrets.AVITO_SERVER_USER }}
          PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${PORT:-22}"
          result="$(cat tools/fl_xkb_compiler_preflight.py | ssh -F /dev/null -4 -T \
            -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/fl-ssh/known_hosts" \
            -o IdentitiesOnly=yes -i "$RUNNER_TEMP/fl-ssh/key" -p "$port" \
            "$USER@$HOST" 'python3 -')"
          printf '%s\n' "$result" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("schema")=="fl.xkb.compiler.preflight.v1" and d.get("write_actions") is False and d.get("owner_session_used") is False; print(json.dumps(d,sort_keys=True))'
