name: FL.ru — fontconfig runtime diagnosis

on:
  pull_request:
    paths:
      - 'tools/fl_fontconfig_diagnostic.py'
      - '.github/workflows/fl-fontconfig-diagnose.yml'
  push:
    branches: [main]
    paths:
      - 'tools/fl_fontconfig_diagnostic.py'
      - '.github/workflows/fl-fontconfig-diagnose.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check read-only diagnostic syntax
        run: |
          python3 -m py_compile tools/fl_fontconfig_diagnostic.py
          python3 - <<'PY'
          import sys
          sys.path.insert(0,"tools")
          from fl_fontconfig_diagnostic import safe_run
          assert safe_run(["missing_font_tool_897541"])["category"]=="unavailable"
          print("FL_FONTCONFIG_OFFLINE_OK")
          PY

  private_probe:
    needs: offline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare pinned SSH
        env:
          KEY_B64: ${{ secrets.AVITO_SERVER_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.AVITO_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$KEY_B64" && test -n "$KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/fl-font-ssh"
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/fl-font-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/fl-font-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/fl-font-ssh/key" "$RUNNER_TEMP/fl-font-ssh/known_hosts"

      - name: Check VPS fontconfig without browser or owner data
        env:
          HOST: ${{ secrets.AVITO_SERVER_HOST }}
          USER: ${{ secrets.AVITO_SERVER_USER }}
          PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${PORT:-22}"
          output="$(cat tools/fl_fontconfig_diagnostic.py | ssh -F /dev/null -4 -T \
            -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/fl-font-ssh/known_hosts" \
            -o IdentitiesOnly=yes -i "$RUNNER_TEMP/fl-font-ssh/key" -p "$port" \
            "$USER@$HOST" 'env LD_LIBRARY_PATH="$HOME/.local/usr/lib/x86_64-linux-gnu:$HOME/.local/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" python3 -')"
          printf '%s\n' "$output" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("schema")=="fl.fontconfig.runtime.v1" and d.get("write_actions") is False and d.get("owner_session_used") is False; print(json.dumps(d,sort_keys=True))'
