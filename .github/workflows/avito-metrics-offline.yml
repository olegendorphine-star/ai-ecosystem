name: Avito metrics offline validation
on:
  pull_request:
    paths:
      - 'tools/avito_offline_metrics.py'
      - 'tests/test_avito_offline_metrics.py'
      - '.github/workflows/avito-metrics-offline.yml'
  push:
    branches: ['main']
    paths:
      - 'tools/avito_offline_metrics.py'
      - 'tests/test_avito_offline_metrics.py'
      - '.github/workflows/avito-metrics-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate metrics calculations
        run: python3 -m unittest discover -s tests -p 'test_avito_offline_metrics.py' -v
