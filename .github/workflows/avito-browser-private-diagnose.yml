name: Avito browser — private SSH-only diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/avito-browser-private-diagnose.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/avito-browser-private-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify fixed command schema offline
        run: |
          python3 -m py_compile tools/avito_server_worker.py tools/avito_browser_handoff.py
          python3 -m unittest discover -s tests -p 'test_avito_server_worker.py' -v
          python3 -m unittest discover -s tests -p 'test_avito_browser_handoff.py' -v

  private_probe:
    needs: offline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare pinned SSH identity
        env:
          KEY_B64: ${{ secrets.AVITO_SERVER_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.AVITO_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$KEY_B64"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/avito-ssh"
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/avito-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/avito-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/avito-ssh/key" "$RUNNER_TEMP/avito-ssh/known_hosts"

      - name: Read existing Chromium status via private SSH (no restart)
        env:
          AVITO_SERVER_HOST: ${{ secrets.AVITO_SERVER_HOST }}
          AVITO_SERVER_USER: ${{ secrets.AVITO_SERVER_USER }}
          AVITO_SERVER_PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${AVITO_SERVER_PORT:-22}"
          result=""
          status_rc=0
          result="$(cat tools/avito_server_worker.py | ssh -F /dev/null -4 -T \
            -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/avito-ssh/known_hosts" \
            -o IdentitiesOnly=yes -i "$RUNNER_TEMP/avito-ssh/key" -p "$port" \
            "$AVITO_SERVER_USER@$AVITO_SERVER_HOST" 'python3 - --action handoff_health --json')" || status_rc=$?
          if [ -z "$result" ]; then echo SSH_OR_WORKER_NO_STATUS; exit 1; fi
          printf '%s\n' "$result"
          printf '%s\n' "$result" | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("action")=="handoff_health" and d.get("browser_ready") is True and d.get("ok") is True else 1)'

      - name: One-time public Avito homepage navigation via loopback browser
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'AVITO_PRIVATE_PROBE_2026_11_08')
        env:
          AVITO_SERVER_HOST: ${{ secrets.AVITO_SERVER_HOST }}
          AVITO_SERVER_USER: ${{ secrets.AVITO_SERVER_USER }}
          AVITO_SERVER_PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${AVITO_SERVER_PORT:-22}"
          result=""
          status_rc=0
          result="$(cat tools/avito_server_worker.py | ssh -F /dev/null -4 -T \
            -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/avito-ssh/known_hosts" \
            -o IdentitiesOnly=yes -i "$RUNNER_TEMP/avito-ssh/key" -p "$port" \
            "$AVITO_SERVER_USER@$AVITO_SERVER_HOST" 'python3 - --action avito_navigation_smoke --json')" || status_rc=$?
          if [ -z "$result" ]; then echo SSH_OR_WORKER_NO_NAVIGATION_STATUS; exit 1; fi
          printf '%s\n' "$result"
          printf '%s\n' "$result" | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get("action")=="avito_navigation_smoke" and d.get("ok") is True else 1)'
