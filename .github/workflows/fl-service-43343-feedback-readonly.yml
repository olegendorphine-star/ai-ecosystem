name: FL Service 43343 moderation feedback read-only
on:
  pull_request:
    paths:
      - "tools/fl_service_43343_moderation_readonly.py"
      - ".github/workflows/fl-service-43343-feedback-readonly.yml"
permissions:
  contents: read
jobs:
  read_owner_service:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate non-mutating script
        run: |
          set -euo pipefail
          python3 -m py_compile tools/fl_service_43343_moderation_readonly.py
      - name: Read account owner's service 43343 review only
        env:
          KEY_B64: ${{ secrets.AVITO_SERVER_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.AVITO_SERVER_KNOWN_HOSTS }}
          HOST: ${{ secrets.AVITO_SERVER_HOST }}
          USER: ${{ secrets.AVITO_SERVER_USER }}
          PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "$KEY_B64" && test -n "$KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/flssh"
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/flssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/flssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/flssh/key" "$RUNNER_TEMP/flssh/known_hosts"
          cat tools/fl_service_43343_moderation_readonly.py | ssh -F /dev/null -4 -T \
            -o BatchMode=yes -o ConnectTimeout=15 -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/flssh/known_hosts" \
            -o LogLevel=ERROR -i "$RUNNER_TEMP/flssh/key" -p "${PORT:-22}" "$USER@$HOST" \
            'env LD_LIBRARY_PATH="$HOME/.local/usr/lib/x86_64-linux-gnu:$HOME/.local/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" "$HOME/.avito-agent/venv/bin/python" -' \
            > "$RUNNER_TEMP/moderator-review.json"
          python3 - "$RUNNER_TEMP/moderator-review.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding="utf8"))
          assert d["schema"]=="fl.service.43343.moderation.readonly.v1"
          assert d["write_actions"]==0 and d["messages_opened"]==0
          print("SERVICE_STATUS",d["status"])
          print("OWNER_VERIFIED",d["verified_owner"])
          print("TARGET_PRESENT",d["target_present"])
          print("SERVICE_REVIEW_CONTEXT",d["review_excerpt"])
          print("SERVICE_EDITOR_OPENED",d["edit_page_opened"])
          print("SERVICE_MODERATOR_MESSAGE",d["moderation_excerpt"])
          print("SERVICE_PAGE_TOP",d["editor_excerpt"])
          print("SERVICE_CURRENT_DESCRIPTION",d["current_description"])
          print("SERVICE_LINKS",d["service_links"] if "service_links" in d else [])
          PY
