name: FL-003 client demo — bounded VPS evidence (no account writes)

on:
  pull_request:
    paths:
      - 'tools/fl003_client_demo.py'
      - 'tools/fl003_screencast.py'
      - 'tools/fl003_yandex_marketplace_search.py'
      - 'tests/test_fl003_client_demo.py'
      - '.github/workflows/fl003-client-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test synthetic email, attachment and fail-closed shopping
        run: |
          set -euo pipefail
          python3 -m py_compile tools/fl003_client_demo.py tools/fl003_screencast.py tools/fl003_yandex_marketplace_search.py
          python3 -m unittest discover -s tests -p 'test_fl003_client_demo.py' -v
          python3 tools/fl003_client_demo.py --offline

  vps_live_public_read:
    # Owner's own in-repo branch; no VPS secrets for forks.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify pinned SSH context
        env:
          KEY_B64: ${{ secrets.AVITO_SERVER_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.AVITO_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$KEY_B64" && test -n "$KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/fl003-ssh"
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/fl003-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/fl003-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/fl003-ssh/key" "$RUNNER_TEMP/fl003-ssh/known_hosts"
      - name: Execute isolated server demo, synthetic inbox and public pages only
        env:
          HOST: ${{ secrets.AVITO_SERVER_HOST }}
          USER: ${{ secrets.AVITO_SERVER_USER }}
          PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
        run: |
          set -euo pipefail
          cat tools/fl003_client_demo.py | ssh -F /dev/null -4 -T \
             -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 \
             -o StrictHostKeyChecking=yes \
             -o UserKnownHostsFile="$RUNNER_TEMP/fl003-ssh/known_hosts" \
             -o IdentitiesOnly=yes -o LogLevel=ERROR \
             -i "$RUNNER_TEMP/fl003-ssh/key" -p "${PORT:-22}" \
             "$USER@$HOST" \
             'env LD_LIBRARY_PATH="$HOME/.local/usr/lib/x86_64-linux-gnu:$HOME/.local/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" "$HOME/.avito-agent/venv/bin/python" - --print-full --out "$HOME/.fl003-demo/reports/latest.json"' \
             > "$RUNNER_TEMP/fl003-evidence.json"
          python3 - "$RUNNER_TEMP/fl003-evidence.json" <<'PY'
          import json,sys
          with open(sys.argv[1], encoding="utf-8") as f: d=json.load(f)
          assert d["schema"]=="fl003.client.demo.v1"
          assert d["mail"]["structured_requirements"]
          assert d["reply"]["approval_required"] is True and d["reply"]["sent"] is False
          assert d["external_write_actions"]==0 and d["external_messages_sent"]==0
          assert d["private_mailbox_connected"] is False and d["telegram_connected"] is False
          print("VPS_DEMO_WORKSTATION_OFF", d["workstation_needed"] is False)
          print("VPS_DEMO_MAIL_ATTACHMENT_PARSED", True)
          print("VPS_DEMO_REPLY_DRAFT_ONLY", True)
          print("VPS_DEMO_SHOPPING_STATUS", [p["status"] for p in d["shopping"]["products"]])
          print("VPS_DEMO_FULL_CLIENT_DEMO_READY", d["client_facing_full_demo_ready"])
          PY
      - name: Discover live indexed Ozon and Avito product links using bounded Yandex API
        env:
          YANDEX_FL003_API_KEY: ${{ secrets.YANDEX_FL003_WEBSEARCH_API_KEY || secrets.yandex_api }}
          YANDEX_FL003_FOLDER_ID: b1ga59a6ib54m2km5cgd
        run: |
          set -euo pipefail
          python3 -m py_compile tools/fl003_yandex_marketplace_search.py
          python3 tools/fl003_yandex_marketplace_search.py --dry-run
          python3 tools/fl003_yandex_marketplace_search.py --out "$RUNNER_TEMP/fl003-yandex-index.json"
          python3 - "$RUNNER_TEMP/fl003-yandex-index.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf8'))
          assert d['schema']=='fl003.yandex.search.index.v1'
          assert d['requests_sent']==2
          assert len(d['marketplaces'])==2
          assert all(m['status']=='found' and m['candidates'] for m in d['marketplaces'])
          assert all(c['live_price_verified'] is False for m in d['marketplaces'] for c in m['candidates'])
          print('YANDEX_SEARCH_CANDIDATES', [(m['marketplace'],len(m['candidates'])) for m in d['marketplaces']])
          PY
      - name: Record real server Chromium browser with anonymized email
        env:
          HOST: ${{ secrets.AVITO_SERVER_HOST }}
          USER: ${{ secrets.AVITO_SERVER_USER }}
          PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh_args=(-F /dev/null -4 -T -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/fl003-ssh/known_hosts" -o IdentitiesOnly=yes -o LogLevel=ERROR -i "$RUNNER_TEMP/fl003-ssh/key" -p "${PORT:-22}")
          tar -czf - tools/fl003_client_demo.py tools/fl003_screencast.py tools/fl003_yandex_marketplace_search.py -C "$RUNNER_TEMP" fl003-yandex-index.json | ssh "${ssh_args[@]}" "$USER@$HOST" 'install -d -m 700 "$HOME/.fl003-screencast" && tar -xzf - -C "$HOME/.fl003-screencast"'
          # No font in Git or downloadable artifact: install permissively licensed
          # DejaVu into private VPS runtime, to avoid blank Cyrillic captions.
          test -r /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
          cat /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf | \
            ssh "${ssh_args[@]}" "$USER@$HOST" \
              'install -d -m 700 "$HOME/.fl003-screencast/fonts"; umask 077; cat > "$HOME/.fl003-screencast/fonts/DejaVuSans.ttf"; test -s "$HOME/.fl003-screencast/fonts/DejaVuSans.ttf"'
          ssh "${ssh_args[@]}" "$USER@$HOST" "env FL003_RUN_ID=$RUN_ID bash -s" <<'REMOTE' > "$RUNNER_TEMP/fl003-video-summary.json"
          set -euo pipefail
          root="$HOME/.fl003-screencast"
          output="$root/output/$FL003_RUN_ID"
          umask 077
          env LD_LIBRARY_PATH="$HOME/.local/usr/lib/x86_64-linux-gnu:$HOME/.local/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" "$HOME/.avito-agent/venv/bin/python" "$root/tools/fl003_screencast.py" --output-dir "$output" --search-json "$root/fl003-yandex-index.json"
          test -s "$output/fl003-actual-vps-browser.webm"
          test -s "$output/report.json"
          REMOTE
          python3 - "$RUNNER_TEMP/fl003-video-summary.json" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1],encoding='utf8'))
          assert d['external_messages_sent']==0
          print('FL003_REAL_VPS_SCREENCAST', d['video'])
          print('FL003_VERIFIED_MARKETPLACE_CARDS',d['verified'])
          print('FL003_MAIL_ATTACHMENT_STATES',d['mail_attachments'])
          PY
          install -d "$RUNNER_TEMP/fl003-recording"
          ssh "${ssh_args[@]}" "$USER@$HOST" "env FL003_RUN_ID=$RUN_ID bash -s" <<'REMOTE' > "$RUNNER_TEMP/fl003-output.tgz"
          set -euo pipefail
          cd "$HOME/.fl003-screencast/output/$FL003_RUN_ID"
          tar -czf - fl003-actual-vps-browser.webm report.json
          REMOTE
          tar -xzf "$RUNNER_TEMP/fl003-output.tgz" -C "$RUNNER_TEMP/fl003-recording"
          test -s "$RUNNER_TEMP/fl003-recording/fl003-actual-vps-browser.webm"
          cp "$RUNNER_TEMP/fl003-yandex-index.json" "$RUNNER_TEMP/fl003-recording/yandex-search-index.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fl003-real-vps-browser-screencast
          path: ${{ runner.temp }}/fl003-recording/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fl003-synthetic-evidence
          path: ${{ runner.temp }}/fl003-evidence.json
          retention-days: 7
          if-no-files-found: error
