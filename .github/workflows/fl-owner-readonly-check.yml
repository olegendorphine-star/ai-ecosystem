name: FL.ru freelancer — isolated owner preflight

on:
  pull_request:
    paths:
      - 'tools/fl_browser_probe.py'
      - 'tools/fl_operator_policy.py'
      - 'tests/test_fl_owner_operator.py'
      - '.github/workflows/fl-owner-readonly-check.yml'
  push:
    branches: [main]
    paths:
      - 'tools/fl_browser_probe.py'
      - 'tools/fl_operator_policy.py'
      - 'tests/test_fl_owner_operator.py'
      - '.github/workflows/fl-owner-readonly-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fl-owner-readonly-preflight
  cancel-in-progress: false

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile FL owner modules
        run: |
          python3 -m py_compile tools/fl_browser_probe.py tools/fl_operator_policy.py
      - name: Offline security and policy tests
        run: |
          python3 -m unittest discover -s tests -p 'test_fl_owner_operator.py' -v

  private_server:
    needs: offline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare pinned SSH for existing VPS
        env:
          KEY_B64: ${{ secrets.AVITO_SERVER_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.AVITO_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$KEY_B64" && test -n "$KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/fl-ssh"
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/fl-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/fl-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/fl-ssh/key" "$RUNNER_TEMP/fl-ssh/known_hosts"

      - name: FL public profile and projects through isolated headless Chromium
        env:
          HOST: ${{ secrets.AVITO_SERVER_HOST }}
          USER: ${{ secrets.AVITO_SERVER_USER }}
          PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${PORT:-22}"
          result=""
          rc=0
          result="$(cat tools/fl_browser_probe.py | ssh -F /dev/null -4 -T \
            -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/fl-ssh/known_hosts" \
            -o IdentitiesOnly=yes -i "$RUNNER_TEMP/fl-ssh/key" -p "$port" \
            "$USER@$HOST" 'env LD_LIBRARY_PATH="$HOME/.local/usr/lib/x86_64-linux-gnu:$HOME/.local/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" "$HOME/.avito-agent/venv/bin/python" - --action public_probe')" || rc=$?
          if [ -z "$result" ]; then echo FL_PUBLIC_PROBE_NO_RESULT; exit 1; fi
          printf '%s\n' "$result" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("schema")=="fl.owner.operator.preflight.v1" and d.get("login")=="olegendorphine" and d.get("write_actions") is False and d.get("payments") is False; print(json.dumps(d,sort_keys=True))'

      - name: FL session inventory, without login or profile changes
        env:
          HOST: ${{ secrets.AVITO_SERVER_HOST }}
          USER: ${{ secrets.AVITO_SERVER_USER }}
          PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${PORT:-22}"
          result=""
          rc=0
          result="$(cat tools/fl_browser_probe.py | ssh -F /dev/null -4 -T \
            -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/fl-ssh/known_hosts" \
            -o IdentitiesOnly=yes -i "$RUNNER_TEMP/fl-ssh/key" -p "$port" \
            "$USER@$HOST" 'env LD_LIBRARY_PATH="$HOME/.local/usr/lib/x86_64-linux-gnu:$HOME/.local/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" "$HOME/.avito-agent/venv/bin/python" - --action session_probe')" || rc=$?
          if [ -z "$result" ]; then echo FL_SESSION_PROBE_NO_RESULT; exit 1; fi
          printf '%s\n' "$result" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("action")=="session_probe" and d.get("write_actions") is False; print(json.dumps(d,sort_keys=True))'
