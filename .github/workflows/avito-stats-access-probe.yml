name: Avito statistics — one-shot SAFE read-only
on:
  workflow_dispatch:
    inputs:
      approve_readonly:
        type: boolean
        required: true
        default: false
  push:
    branches: ['main']
    paths:
      - '.github/workflows/avito-stats-access-probe.yml'
permissions:
  contents: read
jobs:
  stats_probe:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.approve_readonly == true && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'RUN_ONCE_AVITO_STATS_READONLY_2026_11_12')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read-only stats permission probe, statuses only
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          AVITO_ALLOW_STATS_READONLY: 'YES'
        run: |
          if [[ "${{ github.event_name }}" == "push" && "$(date -u +%F)" != "2026-11-12" ]]; then
            echo ONE_SHOT_EXPIRED
            exit 0
          fi
          python3 tools/avito_stats_access_probe.py
