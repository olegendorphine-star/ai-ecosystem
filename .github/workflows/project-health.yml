name: Project health - complete offline regression
on:
  pull_request:
    paths: ['tools/**', 'tests/**', '.github/workflows/**', 'docs/avito-feed.xml']
  push:
    branches: [main]
    paths: ['tools/**', 'tests/**', '.github/workflows/**', 'docs/avito-feed.xml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: python3 -m pip install cryptography==50.0.0 PyYAML==6.0.3
      - name: Run all offline tests and feed audit without credentials
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          python3 tools/avito_offline_feed_audit.py --feed docs/avito-feed.xml
