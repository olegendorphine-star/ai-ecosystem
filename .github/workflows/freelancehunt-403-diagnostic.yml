name: Freelancehunt - VPS 403 detailed diagnostic
on:
  push:
    branches: [feature/freelancehunt-api-probe-20261111]
    paths:
      - '.github/workflows/freelancehunt-403-diagnostic.yml'
      - 'tools/freelancehunt_403_diagnostic.py'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Check syntax
        run: python3 -m py_compile tools/freelancehunt_403_diagnostic.py
      - name: Diagnose from existing VPS
        env:
          HOST: ${{ secrets.AVITO_SERVER_HOST }}
          USER: ${{ secrets.AVITO_SERVER_USER }}
          PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
          SSH_KEY: ${{ secrets.AVITO_SERVER_SSH_KEY_B64 }}
          KNOWN: ${{ secrets.AVITO_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USER" && test -n "$SSH_KEY" && test -n "$KNOWN"
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s' "$SSH_KEY" | base64 -d > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$KNOWN" > "$RUNNER_TEMP/ssh/known"
          chmod 600 "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known"
          cat tools/freelancehunt_403_diagnostic.py | ssh -F /dev/null -4 -T \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known" \
            -o IdentitiesOnly=yes -o LogLevel=ERROR -i "$RUNNER_TEMP/ssh/key" \
            -p "${PORT:-22}" "$USER@$HOST" 'python3 -' | \
          python3 -c '
          import json,sys
          o=json.load(sys.stdin)
          assert o["schema"]=="fh.access.diagnostics.v1" and o["read_only"] and not o["secret_printed"]
          print("FH_DIAGNOSTIC",json.dumps(o,sort_keys=True))
          '
      - name: Compare separate GitHub-hosted network (GET only)
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error
          req=urllib.request.Request("https://freelancehunt.com/",headers={"User-Agent":"FreelancehuntOwnerNetworkAudit/1.0"},method="GET")
          try:
              with urllib.request.urlopen(req,timeout=15) as r:
                  print("FH_GITHUB_EGRESS_HTTP",r.status)
                  print("FH_GITHUB_CLOUDFLARE", "cloudflare" in (r.headers.get("Server") or "").lower())
          except urllib.error.HTTPError as e:
              print("FH_GITHUB_EGRESS_HTTP",e.code)
              print("FH_GITHUB_CLOUDFLARE", "cloudflare" in (e.headers.get("Server") or "").lower())
          except Exception:
              print("FH_GITHUB_EGRESS_ERROR", "network_error")
          PY
