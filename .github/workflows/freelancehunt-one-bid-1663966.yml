name: Freelancehunt - submit ONE owner-authorized free bid
on:
  push:
    branches: [feature/freelancehunt-api-probe-20261111]
    paths:
      - '.github/workflows/freelancehunt-one-bid-1663966.yml'
      - 'tools/freelancehunt_one_bid_1663966.py'
permissions:
  contents: read
concurrency:
  group: freelancehunt-one-bid-1663966
  cancel-in-progress: false
jobs:
  one_bid:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - name: Syntax test
        run: python3 -m py_compile tools/freelancehunt_one_bid_1663966.py
      - name: One owner-authorized bid, 5000 UAH, no paid actions
        env:
          HOST: ${{ secrets.AVITO_SERVER_HOST }}
          USER: ${{ secrets.AVITO_SERVER_USER }}
          PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
          SSH_KEY_B64: ${{ secrets.AVITO_SERVER_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.AVITO_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USER" && test -n "$SSH_KEY_B64" && test -n "$KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/ssh"
          printf '%s' "$SSH_KEY_B64" | base64 -d > "$RUNNER_TEMP/ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/key" "$RUNNER_TEMP/ssh/known_hosts"
          cat tools/freelancehunt_one_bid_1663966.py | ssh -F /dev/null -4 -T \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" \
            -o IdentitiesOnly=yes -o LogLevel=ERROR -i "$RUNNER_TEMP/ssh/key" \
            -p "${PORT:-22}" "$USER@$HOST" 'python3 -'
