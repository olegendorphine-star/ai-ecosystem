name: Avito browser — install user-local Chromium

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare SSH files
        env:
          SERVER_KEY_B64: ${{ secrets.AVITO_SERVER_SSH_KEY_B64 }}
          SERVER_KNOWN_HOSTS: ${{ secrets.AVITO_SERVER_KNOWN_HOSTS }}
        run: |
          test -n "$SERVER_KEY_B64"
          test -n "$SERVER_KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/avito-ssh"
          printf '%s' "$SERVER_KEY_B64" | base64 --decode > "$RUNNER_TEMP/avito-ssh/avito_server_ed25519"
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$RUNNER_TEMP/avito-ssh/avito_server_known_hosts"
          chmod 600 "$RUNNER_TEMP/avito-ssh/avito_server_ed25519" "$RUNNER_TEMP/avito-ssh/avito_server_known_hosts"
      - name: Install Chromium and Playwright in user home
        env:
          AVITO_SERVER_HOST: ${{ secrets.AVITO_SERVER_HOST }}
          AVITO_SERVER_USER: ${{ secrets.AVITO_SERVER_USER }}
          AVITO_SERVER_PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
        run: |
          test -n "$AVITO_SERVER_HOST"
          test -n "$AVITO_SERVER_USER"
          AVITO_SERVER_PORT="${AVITO_SERVER_PORT:-22}"
          case "$AVITO_SERVER_PORT" in (*[!0-9]*|'') echo "invalid SSH port" >&2; exit 1;; esac
          ssh -F /dev/null -4 -T -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/avito-ssh/avito_server_known_hosts" \
            -o IdentitiesOnly=yes -i "$RUNNER_TEMP/avito-ssh/avito_server_ed25519" -p "$AVITO_SERVER_PORT" \
            "$AVITO_SERVER_USER@$AVITO_SERVER_HOST" 'bash -s' <<'REMOTE'
          set -eu
          install -d -m 750 "$HOME/.avito-agent"
          curl -LsSf https://astral.sh/uv/install.sh | sh
          UV_BIN="$HOME/.local/bin/uv"
          test -x "$UV_BIN"
          "$UV_BIN" venv --clear "$HOME/.avito-agent/venv"
          "$UV_BIN" pip install --python "$HOME/.avito-agent/venv/bin/python" playwright
          "$HOME/.avito-agent/venv/bin/python" -m playwright install chromium
          test -n "$(find "$HOME/.cache/ms-playwright" -type f -perm -u+x \( -name chrome -o -name headless_shell \) -print -quit)"
          printf '%s\n' BROWSER_INSTALL_OK
          REMOTE
