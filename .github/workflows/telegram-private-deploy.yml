name: Telegram owner - rootless VPS bootstrap (no login)

on:
  push:
    branches: [main]
    paths:
      - 'tools/telegram_owner_operator.py'
      - 'tools/telegram_secure_bridge.py'
      - 'tools/telegram_private_runtime.py'
      - 'tools/telegram_web_encrypted_operator.py'
      - 'tools/telegram_resident_daemon.py'
      - '.github/workflows/telegram-private-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

# Serialize production deploys. Without this, an older queued push can
# finish after a newer push and silently downgrade the resident operator.
concurrency:
  group: telegram-owner-vps-production-deploy
  cancel-in-progress: false

jobs:
  deploy_no_credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare existing pinned SSH access
        env:
          SSH_KEY: ${{ secrets.AVITO_SERVER_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.AVITO_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/tg-ssh"
          printf '%s' "$SSH_KEY" | base64 --decode > "$RUNNER_TEMP/tg-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/tg-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/tg-ssh/key" "$RUNNER_TEMP/tg-ssh/known_hosts"
      - name: Build isolated pip bootstrap on GitHub runner
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tg-bootstrap-pip"
          python3 -m pip install --disable-pip-version-check --quiet --no-input \
            --target "$RUNNER_TEMP/tg-bootstrap-pip" "pip>=25.2,<27"
          test -s "$RUNNER_TEMP/tg-bootstrap-pip/pip/__main__.py"
      - name: Transfer source only; never export Telegram credentials
        env:
          HOST: ${{ secrets.AVITO_SERVER_HOST }}
          USER: ${{ secrets.AVITO_SERVER_USER }}
          PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$USER"
          port="${PORT:-22}"
          ssh_args=(-F /dev/null -4 -T -o BatchMode=yes -o ConnectTimeout=15 \
                    -o StrictHostKeyChecking=yes \
                    -o UserKnownHostsFile="$RUNNER_TEMP/tg-ssh/known_hosts" \
                    -o IdentitiesOnly=yes -o LogLevel=ERROR \
                    -i "$RUNNER_TEMP/tg-ssh/key" -p "$port")
          # Stop previous owner-private daemon before replacing its code.
          ssh "${ssh_args[@]}" "$USER@$HOST" 'bash -s' <<'STOP'
          set -eu
          if systemctl --user is-active --quiet telegram-resident.service 2>/dev/null; then
            systemctl --user stop telegram-resident.service
          fi
          if [ -f "$HOME/.telegram-agent/browser/telegram_resident_daemon.py" ]; then
            "$HOME/.telegram-agent/bin/telegram-python" \
              "$HOME/.telegram-agent/browser/telegram_resident_daemon.py" stop >/dev/null 2>&1 || true
          fi
          STOP
          tar -cf - tools/telegram_owner_operator.py tools/telegram_secure_bridge.py tools/telegram_private_runtime.py tools/telegram_web_encrypted_operator.py tools/telegram_resident_daemon.py | \
            ssh "${ssh_args[@]}" "$USER@$HOST" \
            'umask 077; mkdir -p "$HOME/.telegram-agent/app"; tar -xf - -C "$HOME/.telegram-agent/app"'
          # Only owner-private browser script deployment; do not move Chrome
          # profile, Telegram cookies, IndexedDB or any owner credentials.
          ssh "${ssh_args[@]}" "$USER@$HOST" \
            'set -eu; umask 077; base="$HOME/.telegram-agent/browser"; test -d "$base" && test ! -L "$base"; cp "$HOME/.telegram-agent/app/tools/telegram_web_encrypted_operator.py" "$base/telegram_web_encrypted_operator.py"; cp "$HOME/.telegram-agent/app/tools/telegram_resident_daemon.py" "$base/telegram_resident_daemon.py"; chmod 600 "$base/telegram_web_encrypted_operator.py" "$base/telegram_resident_daemon.py"; echo TG_PRIVATE_WEB_ADAPTER_DEPLOYED'
          # Prevent stale browser adapters: the VPS file used by the
          # encrypted bridge MUST match this checkout byte-for-byte.
          expected="$(sha256sum tools/telegram_web_encrypted_operator.py | awk '{print $1}')"
          observed="$(ssh "${ssh_args[@]}" "$USER@$HOST" \
            'sha256sum "$HOME/.telegram-agent/browser/telegram_web_encrypted_operator.py" | cut -c1-64')"
          test "$observed" = "$expected"
          expected_agent="$(sha256sum tools/telegram_resident_daemon.py | awk '{print $1}')"
          observed_agent="$(ssh "${ssh_args[@]}" "$USER@$HOST" \
            'sha256sum "$HOME/.telegram-agent/browser/telegram_resident_daemon.py" | cut -c1-64')"
          test "$observed_agent" = "$expected_agent"
          echo TG_PRIVATE_BROWSER_ADAPTER_HASH_MATCH
          # Transfer pip itself as a pure-Python, isolated wheel from runner;
          # the VPS has neither ensurepip nor pip. No system changes or sudo.
          tar -C "$RUNNER_TEMP/tg-bootstrap-pip" -cf - . | \
            ssh "${ssh_args[@]}" "$USER@$HOST" \
            'umask 077; mkdir -p "$HOME/.telegram-agent/bootstrap-pip"; tar -xf - -C "$HOME/.telegram-agent/bootstrap-pip"'
          # No python3-venv/ensurepip on this rootless VPS. Reuse only an
          # existing working Python/pip executable, install dependencies to a
          # private isolated --target folder (do not change Avito/FL venv).
          ssh "${ssh_args[@]}" "$USER@$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          umask 077
          test -x "$HOME/.avito-agent/venv/bin/python"
          mkdir -p "$HOME/.telegram-agent/vendor" "$HOME/.telegram-agent/bin"
          PYTHONPATH="$HOME/.telegram-agent/bootstrap-pip" \
            "$HOME/.avito-agent/venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --quiet \
            --target "$HOME/.telegram-agent/vendor" \
            "Telethon==1.45.0" "cryptography>=44,<48"
          cat > "$HOME/.telegram-agent/bin/telegram-python" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          export PYTHONPATH="$HOME/.telegram-agent/vendor${PYTHONPATH:+:$PYTHONPATH}"
          exec "$HOME/.avito-agent/venv/bin/python" "$@"
          SH
          chmod 0700 "$HOME/.telegram-agent/bin/telegram-python"
          py="$HOME/.telegram-agent/bin/telegram-python"
          "$py" -c 'import telethon,cryptography; print("TG_RUNTIME_IMPORTS_OK")'
          "$py" -m py_compile "$HOME/.telegram-agent/app/tools/telegram_owner_operator.py" "$HOME/.telegram-agent/app/tools/telegram_secure_bridge.py" "$HOME/.telegram-agent/app/tools/telegram_private_runtime.py" "$HOME/.telegram-agent/browser/telegram_web_encrypted_operator.py" "$HOME/.telegram-agent/browser/telegram_resident_daemon.py"
          echo TELEGRAM_CODE_INSTALLED_NO_ACCOUNT_LOGIN
          if [ ! -f "$HOME/.telegram-agent/private/bridge_x25519.pem" ]; then
            "$py" "$HOME/.telegram-agent/app/tools/telegram_secure_bridge.py" init-key >/dev/null
          fi
          test -s "$HOME/.telegram-agent/private/bridge_x25519.pem"
          "$py" "$HOME/.telegram-agent/app/tools/telegram_secure_bridge.py" public-key | sed 's/^/TG_PUBLIC_KEY /'
          if [ -f "$HOME/.telegram-agent/private/telegram.env" ]; then
            echo TG_CREDENTIAL_FILE_PRESENT
          else
            echo TG_AUTH_SETUP_REQUIRED
          fi
          REMOTE
          # Try user systemd supervision; fall back to detached rootless process.
          # No external listener: this daemon owns only a same-user Unix socket.
          ssh "${ssh_args[@]}" "$USER@$HOST" 'bash -s' <<'RESIDENT'
          set -euo pipefail
          umask 077
          base="$HOME/.telegram-agent/browser"
          py="$HOME/.telegram-agent/bin/telegram-python"
          test -f "$base/telegram_resident_daemon.py"
          mkdir -p -m 700 "$HOME/.config/systemd/user"
          use_systemd=0
          if command -v systemctl >/dev/null 2>&1 &&
             systemctl --user show-environment >/dev/null 2>&1; then
            cat > "$HOME/.config/systemd/user/telegram-resident.service" <<EOF
          [Unit]
          Description=Owner-private resident Telegram Web operator
          After=network-online.target

          [Service]
          Type=simple
          ExecStart=$py $base/telegram_resident_daemon.py serve
          WorkingDirectory=$base
          Restart=always
          RestartSec=10
          NoNewPrivileges=true
          UMask=0077
          StandardOutput=null
          StandardError=null

          [Install]
          WantedBy=default.target
          EOF
            systemctl --user daemon-reload
            if systemctl --user enable --now telegram-resident.service >/dev/null 2>&1; then
              use_systemd=1
            fi
          fi
          if [ "$use_systemd" -eq 0 ]; then
            nohup "$py" "$base/telegram_resident_daemon.py" serve \
              </dev/null >/dev/null 2>&1 &
            disown || true
          fi
          ready=0
          for attempt in $(seq 1 45); do
            state="$("$py" "$base/telegram_resident_daemon.py" status || true)"
            if printf '%s' "$state" | grep -Fq '"status":"running"'; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -eq 1 ]; then
            echo TG_RESIDENT_SOCKET_READY
          else
            echo TG_RESIDENT_START_UNVERIFIED
            exit 1
          fi
          if [ "$use_systemd" -eq 1 ]; then
            echo TG_RESIDENT_SUPERVISOR_SYSTEMD_USER
          else
            echo TG_RESIDENT_SUPERVISOR_SESSION_NO_REBOOT_GUARANTEE
          fi
          RESIDENT
          # First-time login must be done interactively on the owner's VPS.
