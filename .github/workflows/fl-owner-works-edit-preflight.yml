name: FL - Inspect existing owner portfolio works read only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fl-owner-works-edit-preflight.yml'
      - 'tools/fl_owner_works_edit_preflight_20261109.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m py_compile tools/fl_owner_works_edit_preflight_20261109.py
      - name: Read existing works and edit controls without writes
        env:
          KEY_B64: ${{ secrets.AVITO_SERVER_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.AVITO_SERVER_KNOWN_HOSTS }}
          HOST: ${{ secrets.AVITO_SERVER_HOST }}
          USER: ${{ secrets.AVITO_SERVER_USER }}
          PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/fl-ssh"
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/fl-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/fl-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/fl-ssh/key" "$RUNNER_TEMP/fl-ssh/known_hosts"
          port="${PORT:-22}"
          result="$(cat tools/fl_owner_works_edit_preflight_20261109.py | ssh -F /dev/null -4 -T \
            -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/fl-ssh/known_hosts" \
            -o IdentitiesOnly=yes -o LogLevel=ERROR \
            -i "$RUNNER_TEMP/fl-ssh/key" -p "$port" "$USER@$HOST" \
            'env LD_LIBRARY_PATH="$HOME/.local/usr/lib/x86_64-linux-gnu:$HOME/.local/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" "$HOME/.avito-agent/venv/bin/python" -')"
          printf '%s\n' "$result" | python3 -c 'import sys,json;d=json.load(sys.stdin);assert d["schema"]=="fl.owner.works.edit.preflight.v1" and d["owner"] and d["writes"] is False;print("FL_WORKS_EDIT_PREFLIGHT",json.dumps(d,ensure_ascii=False))'

# Owner-requested 2026-11-10 read-only reassessment before any edit.
