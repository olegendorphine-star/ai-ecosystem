name: Avito capabilities — manual SAFE read-only audit
on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/avito-capability-audit.yml'
  pull_request:
    paths:
      - 'tools/avito_capability_audit.py'
      - 'tests/test_avito_capability_audit.py'
      - '.github/workflows/avito-capability-audit.yml'
  workflow_dispatch:
    inputs:
      approve_readonly:
        description: 'Authorize OAuth and read-only capability checks (no changes, no purchases)'
        required: true
        type: boolean
        default: false
      include_messenger_metadata:
        description: 'Additionally check HTTP status of chats API (discard all chat contents)'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: avito-capabilities-audit
  cancel-in-progress: false
jobs:
  offline_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_avito_capability_audit.py' -v
      - run: python3 tools/avito_capability_audit.py
  live_readonly:
    needs: offline_tests
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.approve_readonly == true && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'RUN_ONCE_AVITO_READONLY_2026_11_05_PR17')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read-only API capability audit
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          AVITO_ALLOW_CAPABILITY_AUDIT: 'YES'
          INCLUDE_MESSENGER: ${{ github.event_name == 'push' || inputs.include_messenger_metadata }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" && "$(date -u +%F)" != "2026-11-05" ]]; then
            echo "ONE_TIME_DATE_GUARD_EXPIRED_NO_LIVE_REQUEST"
            exit 0
          fi
          args=(--live --approve-readonly)
          if [[ "$INCLUDE_MESSENGER" == 'true' ]]; then
            args+=(--include-messenger-metadata)
          fi
          python3 tools/avito_capability_audit.py "${args[@]}"
