name: Avito — encrypted VPS egress diagnostics

on:
  pull_request:
    paths:
      - '.github/workflows/avito-egress-ip-encrypted.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/avito-egress-ip-encrypted.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify one-time RSA public key without server credentials
        run: |
          set -euo pipefail
          openssl version >/dev/null
          awk '/-----BEGIN PUBLIC KEY-----/{copy=1} copy {gsub(/^[[:space:]]+/, ""); print} /-----END PUBLIC KEY-----/{exit}' .github/workflows/avito-egress-ip-encrypted.yml > "$RUNNER_TEMP/egress_pub.pem"
          openssl pkey -pubin -in "$RUNNER_TEMP/egress_pub.pem" -noout
          python3 -c 'import json,ipaddress,urllib.request; print("EGRESS_PROBE_OFFLINE_OK")'

  private_egress:
    needs: offline
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare pinned SSH and one-time recipient public key
        env:
          KEY_B64: ${{ secrets.AVITO_SERVER_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.AVITO_SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$KEY_B64"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 "$RUNNER_TEMP/avito-ssh"
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/avito-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/avito-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/avito-ssh/key" "$RUNNER_TEMP/avito-ssh/known_hosts"
          cat > "$RUNNER_TEMP/avito-ssh/egress_pub.pem" <<'PUBLIC_KEY'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA29BOGJIBKbRRS3vQ6qC1
          PLsYd1FbNeR2BdTWUy/zHdmpLwmvlI83jVmeS87+StDc4prTpXZP1ZDZB1Ijzjqk
          ijkde7KhSqwrjVQnC5GRI70yn+Cy7DpkrM8P9OKfsnpiGMyyI2uMPevUfD3HUgD5
          UQRfk5EoL/7+v87mC4HPNRPfpKZUraf+mFWuaSMEY4fIRSbf5j0w0hLEis3IV/kc
          MWAhb9bWBIx5ol4mSftQOpXveEzU4csPrjxbeKhiEE+uylsolguxpyQcJkglJyHz
          +p+8p0rT8iHoLdR4fcvBV/VcEill4j1UNRi9iaf7+GDAPEcdB+3SU5p4Kzu86Aw3
          BQIDAQAB
          -----END PUBLIC KEY-----
          PUBLIC_KEY
          openssl pkey -pubin -in "$RUNNER_TEMP/avito-ssh/egress_pub.pem" -noout >/dev/null

      - name: Probe server IPv4 and encrypt it before any GitHub logging
        env:
          AVITO_SERVER_HOST: ${{ secrets.AVITO_SERVER_HOST }}
          AVITO_SERVER_USER: ${{ secrets.AVITO_SERVER_USER }}
          AVITO_SERVER_PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
        run: |
          set -euo pipefail
          port="${AVITO_SERVER_PORT:-22}"
          # Never write or echo the plaintext IP on GitHub. SSH stdout goes
          # directly into public-key encryption; private key stays off GitHub.
          cipher="$(ssh -F /dev/null -4 -T \
            -o BatchMode=yes -o ConnectTimeout=15 -o ConnectionAttempts=1 \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/avito-ssh/known_hosts" \
            -o IdentitiesOnly=yes -i "$RUNNER_TEMP/avito-ssh/key" -p "$port" \
            "$AVITO_SERVER_USER@$AVITO_SERVER_HOST" 'python3 -' <<'PY' | \
              openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/avito-ssh/egress_pub.pem" \
                -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | \
              base64 -w0
          import datetime
          import ipaddress
          import json
          import os
          import urllib.request
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          req = urllib.request.Request(
              "https://api4.ipify.org?format=json", method="GET",
              headers={"User-Agent": "AvitoOwnerDiagnostic/1.0"}
          )
          with opener.open(req, timeout=12) as response:
              if response.status != 200:
                  raise SystemExit("EGRESS_PROVIDER_UNAVAILABLE")
              obj = json.loads(response.read(256).decode())
          ip = ipaddress.ip_address(obj["ip"])
          if ip.version != 4 or not ip.is_global:
              raise SystemExit("EGRESS_IP_NOT_PUBLIC")
          payload = {
              "ip": str(ip),
              "checked_at_utc": datetime.datetime.now(
                  datetime.timezone.utc).isoformat(timespec="seconds"),
              "proxy_env_present": any(
                  os.environ.get(k) for k in ("HTTP_PROXY", "HTTPS_PROXY", "ALL_PROXY",
                                               "http_proxy", "https_proxy", "all_proxy"))
          }
          print(json.dumps(payload, separators=(",", ":")))
          PY
          )"
          test -n "$cipher"
          printf 'EGRESS_CIPHERTEXT_BASE64=%s\n' "$cipher"
          echo EGRESS_IP_ENCRYPTED_OK
