name: Avito — Session Guardian fail-closed tests

on:
  pull_request:
    paths:
      - 'tools/avito_session_guardian.py'
      - 'tools/avito_operator_agent.py'
      - 'tests/test_avito_session_guardian.py'
      - 'tests/test_avito_operator_agent.py'
      - '.github/workflows/avito-session-guardian-offline.yml'
  push:
    branches: [main]
    paths:
      - 'tools/avito_session_guardian.py'
      - 'tools/avito_operator_agent.py'
      - 'tests/test_avito_session_guardian.py'
      - 'tests/test_avito_operator_agent.py'
      - '.github/workflows/avito-session-guardian-offline.yml'

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check guardian and operator syntax
        run: |
          python3 -m py_compile tools/avito_session_guardian.py tools/avito_operator_agent.py
      - name: Test access restriction, auth and session guard
        run: |
          python3 -m unittest discover -s tests -p 'test_avito_session_guardian.py' -v
          python3 -m unittest discover -s tests -p 'test_avito_operator_agent.py' -v
