name: Avito PriceList — official public XML checker, no publication

on:
  pull_request:
    paths:
      - 'tools/avito_pricelist_public_validator.py'
      - 'tests/test_avito_pricelist_public_validator.py'
      - '.github/workflows/avito-pricelist-official-check.yml'
      - 'docs/avito-pricelist-validation-preview-2026-11-05.xml'
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/avito-pricelist-official-check.yml'

permissions:
  contents: read

concurrency:
  group: avito-pricelist-official-check
  cancel-in-progress: false

jobs:
  offline_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Offline public-checker tests
        run: python3 -m unittest discover -s tests -p 'test_avito_pricelist_public_validator.py' -v

  check_candidate:
    needs: offline_tests
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'RUN_ONCE_AVITO_PUBLIC_XML_VALIDATOR_2026_11_05') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Submit candidate URL to public XML checker only
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(date -u +%F)" != "2026-11-05" ]]; then
            echo "EXPIRED_PUBLIC_CHECKER_NOT_CALLED"
            exit 0
          fi
          python3 tools/avito_pricelist_public_validator.py \
            docs/reports/avito-pricelist-validator-2026-11-05.json
      - name: Publish only sanitized checker result (never live feed)
        shell: bash
        run: |
          set -euo pipefail
          FILE='docs/reports/avito-pricelist-validator-2026-11-05.json'
          if [[ ! -f "$FILE" ]]; then
            echo "NO_REPORT_NOT_WRITTEN"
            exit 0
          fi
          git add -- "$FILE"
          if git diff --cached --quiet; then
            echo "REPORT_ALREADY_CURRENT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "report: isolated Avito public PriceList XML validator result"
          git push origin HEAD:main
          echo "PUBLIC_CHECKER_RESULT_SAVED"
