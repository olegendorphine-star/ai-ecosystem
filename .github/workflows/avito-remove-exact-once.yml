name: Avito 8347570435 — single owner-authorized archive request

# One-shot run triggered only when this workflow file is first added to this exact branch.
# Never retries DELETE; checks exact item ID and project title directly before the request.
# Reattempt permitted: previous attempt stopped BEFORE DELETE due to too-narrow title matcher.
on:
  push:
    branches:
      - feature/avito-remove-exact-8347570435-2026-11-04
    paths:
      - .github/workflows/avito-remove-exact-once.yml

permissions:
  contents: read

concurrency:
  group: avito-remove-8347570435-once
  cancel-in-progress: false

jobs:
  remove:
    if: ${{ github.repository == 'olegendorphine-star/ai-ecosystem' && github.ref == 'refs/heads/feature/avito-remove-exact-8347570435-2026-11-04' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout task branch without retained Git credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Offline safety tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_avito_remove_once.py' -v
      - name: Verify exact owned project listing, perform one archive request and read back
        shell: bash
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          AVITO_REMOVE_EXACT_8347570435: 'YES'
        run: |
          set -euo pipefail
          python3 tools/avito_remove_once.py
