name: Avito GitHub server bridge — safe offline tests

on:
  pull_request:
    paths:
      - 'tools/avito_github_bridge_worker.py'
      - 'tests/test_avito_github_bridge_worker.py'
      - '.github/workflows/avito-github-server-bridge-tests.yml'
      - '.github/workflows/avito-github-issue-bridge-readonly.yml'
  push:
    branches: ['main']
    paths:
      - 'tools/avito_github_bridge_worker.py'
      - 'tests/test_avito_github_bridge_worker.py'
      - '.github/workflows/avito-github-server-bridge-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Compile without network or secrets
        run: python3 -m py_compile tools/avito_github_bridge_worker.py
      - name: Offline tests — only mocked HTTP endpoints
        run: |
          python3 -m unittest discover -s tests -p 'test_avito_github_bridge_worker.py' -v
          python3 -m unittest discover -s tests -p 'test_avito_spb_pricelist_live_status.py' -v
