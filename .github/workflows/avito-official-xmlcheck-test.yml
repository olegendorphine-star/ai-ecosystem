name: Avito XML checker retrieve existing report only
on:
  push:
    branches: ["test/avito-official-xmlcheck-2026-11-05"]
permissions:
  contents: read
jobs:
  result:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read existing official validator report without new submission
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,urllib.error
          url='https://autoload.avito.ru/api/v2/public/xml_checker/result/6aec2f3a135917229b21cf87/'
          for attempt in range(7):
              try:
                  req=urllib.request.Request(url,headers={'Accept':'application/json','Referer':'https://autoload.avito.ru/format/xmlcheck/','User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      data=json.load(response)
                  print('REPORT_RESPONSE',attempt+1,json.dumps(data,ensure_ascii=False)[:16000],flush=True)
                  msgs=data.get('messages') or []
                  pending=any('в работе' in str(m.get('text','')).lower() for m in msgs)
                  if not pending:
                      print('REPORT_READY',True,flush=True)
                      break
              except (urllib.error.HTTPError,urllib.error.URLError,TimeoutError) as exc:
                  print('REPORT_REQUEST_ERROR',attempt+1,type(exc).__name__,getattr(exc,'code',''),flush=True)
              if attempt<6: time.sleep(8)
          PY
