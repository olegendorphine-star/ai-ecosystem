name: Avito server bridge — install read-only worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Prepare SSH files
        env:
          SERVER_KEY: ${{ secrets.AVITO_SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.AVITO_SERVER_KNOWN_HOSTS }}
        run: |
          test -n "$SERVER_KEY"
          test -n "$SERVER_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SERVER_KEY" > "$HOME/.ssh/avito_server_ed25519"
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$HOME/.ssh/avito_server_known_hosts"
          chmod 600 "$HOME/.ssh/avito_server_ed25519" "$HOME/.ssh/avito_server_known_hosts"
      - name: Copy worker to temporary path
        env:
          AVITO_SERVER_HOST: ${{ secrets.AVITO_SERVER_HOST }}
          AVITO_SERVER_USER: ${{ secrets.AVITO_SERVER_USER }}
        run: |
          test -n "$AVITO_SERVER_HOST"
          test -n "$AVITO_SERVER_USER"
          scp -O -q -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/avito_server_known_hosts" \
            -o IdentitiesOnly=yes -i "$HOME/.ssh/avito_server_ed25519" \
            tools/avito_server_worker.py \
            "$AVITO_SERVER_USER@$AVITO_SERVER_HOST:/tmp/avito_server_worker.py"
      - name: Install worker in user home
        env:
          AVITO_SERVER_HOST: ${{ secrets.AVITO_SERVER_HOST }}
          AVITO_SERVER_USER: ${{ secrets.AVITO_SERVER_USER }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/avito_server_known_hosts" \
            -o IdentitiesOnly=yes -i "$HOME/.ssh/avito_server_ed25519" \
            "$AVITO_SERVER_USER@$AVITO_SERVER_HOST" \
            'install -d -m 750 "$HOME/avito-agent" && install -m 750 /tmp/avito_server_worker.py "$HOME/avito-agent/avito_server_worker.py" && rm -f /tmp/avito_server_worker.py'
