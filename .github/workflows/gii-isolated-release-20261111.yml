name: Gii isolated release maintenance 2026-11-11
on:
  push:
    branches: ["gii/isolated-release-20261111"]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Maintain isolated Gii release only
        env:
          KEY_B64: ${{ secrets.AVITO_SERVER_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.AVITO_SERVER_KNOWN_HOSTS }}
          SERVER_HOST: ${{ secrets.AVITO_SERVER_HOST }}
          SERVER_USER: ${{ secrets.AVITO_SERVER_USER }}
          SERVER_PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
        run: |
          python3 - <<'PY'
          import os,base64,subprocess,sys
          root=os.environ["RUNNER_TEMP"]+"/gii-ro"
          os.makedirs(root,mode=0o700,exist_ok=True)
          key=root+"/key";known=root+"/known_hosts"
          for name,value in [(key,base64.b64decode(os.environ["KEY_B64"])),(known,os.environ["KNOWN_HOSTS"].encode())]:
           fd=os.open(name,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
           with os.fdopen(fd,"wb") as f:f.write(value)
          port=os.environ.get("SERVER_PORT") or "22"
          if not port.isdigit():raise SystemExit("invalid_port")
          cmd=["ssh","-F","/dev/null","-4","-T","-o","BatchMode=yes","-o","ConnectTimeout=15","-o","StrictHostKeyChecking=yes","-o","UserKnownHostsFile="+known,"-o","IdentitiesOnly=yes","-i",key,"-p",port,os.environ["SERVER_USER"]+"@"+os.environ["SERVER_HOST"],"python3 -"]
          try:
           r=subprocess.run(cmd,input="from pathlib import Path\nimport json,subprocess\nroot=Path.home()/\"gii-work\"\nif (root/\".gii-scope\").read_text().strip()!=\"GII-ONLY-20261111\":raise RuntimeError(\"scope_mismatch\")\np=root/\"runtime/ops.py\";p.write_text(\"#!/usr/bin/env python3\\n\\\"\\\"\\\"Fixed operations for the new Gii-only owner-user installation. No model clients.\\\"\\\"\\\"\\nimport argparse,json,pathlib,subprocess,urllib.request\\nROOT=pathlib.Path.home()/'gii-work'\\nUNITS=['gii-work-app.service','gii-work-edge.service','gii-work-tunnel.service']\\ndef main():\\n    parser=argparse.ArgumentParser();parser.add_argument('action',choices=['status','health','backup','reconcile','start','stop']);args=parser.parse_args()\\n    if (ROOT/'.gii-scope').read_text().strip()!='GII-ONLY-20261111':raise SystemExit('Gii scope marker mismatch')\\n    if args.action=='status':\\n        r=subprocess.run(['systemctl','--user','show',*UNITS,'gii-work-backup.timer','--property=Id,ActiveState,SubState,UnitFileState'],capture_output=True,text=True,check=True)\\n        print(json.dumps({'units':r.stdout,'endpoint':(ROOT/'public-endpoint.txt').read_text().strip(),'latest_backup':json.loads((ROOT/'control/latest-backup.json').read_text())}))\\n    elif args.action=='health':\\n        with urllib.request.urlopen('http://127.0.0.1:18770/health',timeout=5) as r:health=json.load(r)\\n        with urllib.request.urlopen('http://127.0.0.1:20243/quicktunnel',timeout=5) as r:host=json.load(r)['hostname']\\n        if not host.endswith('.trycloudflare.com') or '/' in host:raise SystemExit('Unexpected tunnel hostname')\\n        endpoint='https://'+host;(ROOT/'public-endpoint.txt').write_text(endpoint+'\\\\n');print(json.dumps({'health':health,'endpoint':endpoint,'external_http_verification':'separate_external_client_required'}))\\n    elif args.action=='backup':subprocess.run(['/usr/bin/python3',str(ROOT/'runtime/backup.py')],check=True)\\n    elif args.action=='reconcile':\\n        import os\\n        env=dict(os.environ);env['GII_DATA']=str(ROOT/'data/sonar-1.2')\\n        subprocess.run(['/usr/bin/python3',str(ROOT/'releases/sonar-1.2.0-rc2/gii-website/app.py'),'reconcile'],env=env,check=True)\\n    elif args.action=='start':subprocess.run(['systemctl','--user','start',*UNITS,'gii-work-backup.timer'],check=True)\\n    elif args.action=='stop':subprocess.run(['systemctl','--user','stop','gii-work-backup.timer',*reversed(UNITS)],check=True)\\nif __name__=='__main__':main()\\n\");p.chmod(0o600)\nr=subprocess.run([\"/usr/bin/python3\",str(p),\"health\"],capture_output=True,text=True,check=True,timeout=10)\nprint(json.dumps({\"schema\":\"gii.ops-installed.v1\",\"ops_health\":json.loads(r.stdout),\"scope\":\"new Gii only\"}))\n",capture_output=True,text=True,timeout=70)
           print(r.stdout)
           if r.returncode:print("SSH_CONNECTION_FAILED",r.returncode)
           sys.exit(r.returncode)
          finally:
           os.unlink(key);os.unlink(known)
          
          PY
