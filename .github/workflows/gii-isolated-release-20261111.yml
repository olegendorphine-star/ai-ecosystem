")) as tmp:\n restore=Path(tmp);shutil.copy2(backup_path,restore/\"gii.sqlite3\")\n sys.path.insert(0,str(release/\"gii-website\"));import app\n app.DATA=restore;app.init();status=[]\n env={\"REQUEST_METHOD\":\"GET\",\"PATH_INFO\":\"/sonar/export/\"+credentials[\"run_id\"],\"QUERY_STRING\":\"\",\"HTTP_X_GII_SONAR_TOKEN\":credentials[\"token\"],\"HTTP_HOST\":\"gii-restore.invalid\",\"wsgi.input\":io.BytesIO(b\"\"),\"CONTENT_LENGTH\":\"0\"}\n raw=b\"\".join(app.App()(env,lambda s,h:status.append(int(s.split()[0]))))\n exported=json.loads(raw)\n original=json.loads((root/\"control/external-smoke.json\").read_text())[\"export\"]\n if status!=[200] or exported[\"response\"][\"response\"]!=original[\"response\"][\"response\"] or exported[\"journal_receipt\"]!=original[\"journal_receipt\"]:raise RuntimeError(\"restored_export_mismatch\")\n restore_export={\"status\":200,\"schema\":exported[\"schema\"],\"response_exact_equal\":True,\"receipt_equal\":True}\nservices={}\nfor u in [\"gii-work-app.service\",\"gii-work-edge.service\",\"gii-work-tunnel.service\",\"gii-work-backup.timer\"]:\n r=subprocess.run([\"systemctl\",\"--user\",\"show\",u,\"--property=Id,ActiveState,SubState,UnitFileState\"],capture_output=True,text=True,timeout=5);services[u]=r.stdout\nstate={\"schema\":\"gii.work.activated.v1\",\"at\":datetime.datetime.now(datetime.timezone.utc).isoformat(),\"base_url\":base,\"site_url\":base+\"/sonar\",\"application\":\"0.2.1\",\"sonar\":\"1.2.0-rc2\",\"release_sha256\":\"227a27d75d36ab49f49df7c00fbeb52968bb1df4074721e4605eaf1da5350726\",\"source_commit\":\"9276616043628b6a2820c71f54334367440c6144\",\"new_database\":str(root/\"data/sonar-1.2/gii.sqlite3\"),\"technical_control_runs\":1,\"real_model_calls\":0,\"old_Gii_databases\":\"untouched_not_read_permission_denied\",\"personal_kimi_accessed\":False,\"existing_system_services_changed\":False,\"restored_export\":restore_export,\"services\":services,\"boot_persistence\":\"user units enabled, linger=no; requires user manager after reboot\",\"public_endpoint\":\"temporary_quick_tunnel_not_permanent_DNS\",\"runtime_edge_sha256\":hashlib.sha256(edge_script.encode()).hexdigest()}\n(root/\"control/current-state.json\").write_text(json.dumps(state,indent=2)+\"\\n\")\npackage=root/\"control/Gii_Work_Activated_2026-11-11.zip\"\nfiles=[]\nfor name in [\"deployment.json\",\"external-smoke.json\",\"latest-backup.json\",\"current-state.json\"]:files.append((root/\"control\"/name,\"control/\"+name))\nfiles.extend((p,\"backup/\"+p.relative_to(backup_path.parent).as_posix()) for p in backup_path.parent.rglob(\"*\") if p.is_file())\nfor p in (root/\"logs/release-checks\").rglob(\"*\"):\n if p.is_file():files.append((p,\"server-checks/\"+p.relative_to(root/\"logs/release-checks\").as_posix()))\nfor name in [\"start_edge.py\",\"backup.py\"]:files.append((root/\"runtime\"/name,\"runtime/\"+name))\nfor name in [\"gii-work-app.service\",\"gii-work-edge.service\",\"gii-work-tunnel.service\",\"gii-work-backup.service\",\"gii-work-backup.timer\"]:files.append((Path.home()/\".config/systemd/user\"/name,\"units/\"+name))\nfiles.append((release/\"manifest.json\",\"release-manifest.json\"))\nsecrets_to_exclude=[credentials[\"token\"].encode(),credentials[\"challenge\"].encode()]\nenv=dict(x.split(\"=\",1) for x in (root/\"runtime.env\").read_text().splitlines() if \"=\" in x);secrets_to_exclude.append(env[\"GII_RUN_ISSUER_TOKEN\"].encode())\nsums=[]\nwith zipfile.ZipFile(package,\"w\",zipfile.ZIP_DEFLATED) as archive:\n for path,name in files:\n  content=path.read_bytes()\n  if any(secret in content for secret in secrets_to_exclude):raise RuntimeError(\"credential_in_archive_surface\")\n  archive.writestr(name,content);sums.append(hashlib.sha256(content).hexdigest()+\"  \"+name)\n archive.writestr(\"SHA256SUMS\",\"\\n\".join(sums)+\"\\n\")\nraw=package.read_bytes()\ncert=\"-----BEGIN CERTIFICATE-----\\nMIID3jCCAkagAwIBAgIUTWSanKXGQp1Si6u1jameFOr5h14wDQYJKoZIhvcNAQEL\\nBQAwKTEnMCUGA1UEAwweR2lpIGRlcGxveW1lbnQgYm