name: Gii isolated release maintenance 2026-11-11
on:
  push:
    branches: ["gii/isolated-release-20261111"]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Maintain isolated Gii release only
        env:
          KEY_B64: ${{ secrets.AVITO_SERVER_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.AVITO_SERVER_KNOWN_HOSTS }}
          SERVER_HOST: ${{ secrets.AVITO_SERVER_HOST }}
          SERVER_USER: ${{ secrets.AVITO_SERVER_USER }}
          SERVER_PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
        run: |
          python3 - <<'PY'
          import os,base64,subprocess,sys
          root=os.environ["RUNNER_TEMP"]+"/gii-ro"
          os.makedirs(root,mode=0o700,exist_ok=True)
          key=root+"/key";known=root+"/known_hosts"
          for name,value in [(key,base64.b64decode(os.environ["KEY_B64"])),(known,os.environ["KNOWN_HOSTS"].encode())]:
           fd=os.open(name,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
           with os.fdopen(fd,"wb") as f:f.write(value)
          port=os.environ.get("SERVER_PORT") or "22"
          if not port.isdigit():raise SystemExit("invalid_port")
          cmd=["ssh","-F","/dev/null","-4","-T","-o","BatchMode=yes","-o","ConnectTimeout=15","-o","StrictHostKeyChecking=yes","-o","UserKnownHostsFile="+known,"-o","IdentitiesOnly=yes","-i",key,"-p",port,os.environ["SERVER_USER"]+"@"+os.environ["SERVER_HOST"],"python3 -"]
          try:
           r=subprocess.run(cmd,input="import os,json,subprocess,urllib.request,time\nfrom pathlib import Path\nroot=Path.home()/\"gii-work\";release=root/\"releases/sonar-1.2.0-rc2\"\nif (root/\".gii-scope\").read_text().strip()!=\"GII-ONLY-20261111\":raise RuntimeError(\"scope_mismatch\")\nbackup=root/\"runtime/backup.py\";backup.write_text(\"\\\"\\\"\\\"Backup only the new owner-user Gii contour; no primary deletion.\\\"\\\"\\\"\\nimport datetime,hashlib,json,os,pathlib,secrets,shutil,sqlite3,tempfile\\nROOT=pathlib.Path.home()/'gii-work'\\ndef main():\\n    if (ROOT/'.gii-scope').read_text().strip()!='GII-ONLY-20261111':raise RuntimeError('scope_mismatch')\\n    os.umask(0o077)\\n    env=dict(x.split('=',1) for x in (ROOT/'runtime.env').read_text().splitlines() if '=' in x)\\n    data=pathlib.Path(env['GII_DATA'])\\n    if not data.resolve().is_relative_to((ROOT/'data').resolve()):raise RuntimeError('data_scope_mismatch')\\n    stamp=datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%dT%H%M%SZ')+'-'+secrets.token_hex(3)\\n    out=ROOT/'backups'/stamp;out.mkdir(mode=0o700)\\n    target=out/'gii.sqlite3'\\n    with sqlite3.connect('file:'+str(data/'gii.sqlite3')+'?mode=ro',uri=True) as source,sqlite3.connect(target) as backup:source.backup(backup)\\n    with sqlite3.connect(target) as c:\\n        integrity=c.execute('pragma integrity_check').fetchone()[0]\\n        if integrity!='ok':raise RuntimeError('backup_integrity_failed')\\n        tables=[r[0] for r in c.execute(\\\"select name from sqlite_master where type='table' and name not like 'sqlite_%' order by name\\\")]\\n        logical={t:c.execute('select * from \\\"'+t+'\\\" order by rowid').fetchall() for t in tables}\\n        counts={t:len(v) for t,v in logical.items()}\\n        for rid, in c.execute('select distinct run_id from sonar_journal'):\\n            previous=''\\n            for record,stored in c.execute('select record_json,record_hash from sonar_journal where run_id=? order by seq',(rid,)):\\n                previous=hashlib.sha256((previous+'\\\\n'+record).encode()).hexdigest()\\n                if previous!=stored:raise RuntimeError('journal_chain_invalid')\\n    raw=data/'sonar/raw'\\n    if raw.exists():shutil.copytree(raw,out/'raw')\\n    with tempfile.TemporaryDirectory(prefix='gii-restore-',dir=str(ROOT/'backups')) as tmp:\\n        restored=pathlib.Path(tmp)/'gii.sqlite3';shutil.copyfile(target,restored)\\n        with sqlite3.connect(restored) as c:\\n            if c.execute('pragma integrity_check').fetchone()[0]!='ok':raise RuntimeError('restore_integrity_failed')\\n            if any(c.execute('select * from \\\"'+t+'\\\" order by rowid').fetchall()!=rows for t,rows in logical.items()):raise RuntimeError('restore_logical_mismatch')\\n        restored_sha=hashlib.sha256(restored.read_bytes()).hexdigest()\\n    sha=hashlib.sha256(target.read_bytes()).hexdigest()\\n    if sha!=restored_sha:raise RuntimeError('restore_byte_mismatch')\\n    report={'schema':'gii.scoped-backup.v1','at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'directory':str(out),'sqlite_sha256':sha,'integrity_check':integrity,'restored_integrity':'ok','restored_logical_equal':True,'restored_sha256':restored_sha,'journal_hash_chains_verified':True,'counts':counts,'raw_consistency':'SQLite snapshot authoritative; raw is a separately copied projection','retention':'indefinite_no_primary_deletion'}\\n    (out/'backup-report.json').write_text(json.dumps(report,indent=2)+'\\\\n')\\n    (ROOT/'control/latest-backup.json').write_text(json.dumps(report,indent=2)+'\\\\n')\\n    print(json.dumps(report))\\nif __name__=='__main__':main()\\n\");backup.chmod(0o600)\nunitdir=Path.home()/\".config/systemd/user\"\nfor name in [\"gii-work-backup.service\",\"gii-work-backup.timer\"]:\n p=unitdir/name\n if p.exists() and not p.read_text().startswith(\"# GII-ONLY-20261111\"):raise RuntimeError(\"unit_collision\")\n(unitdir/\"gii-work-backup.service\").write_text(\"# GII-ONLY-20261111\\n[Unit]\\nDescription=Gii Work own-data backup\\n[Service]\\nType=oneshot\\nExecStart=/usr/bin/python3 \"+str(backup)+\"\\nUMask=0077\\nNoNewPrivileges=yes\\nStandardOutput=append:\"+str(root/\"logs/backup.log\")+\"\\nStandardError=inherit\\n\")\n(unitdir/\"gii-work-backup.timer\").write_text(\"# GII-ONLY-20261111\\n[Unit]\\nDescription=Gii Work daily backup, no deletion\\n[Timer]\\nOnCalendar=daily\\nPersistent=true\\nRandomizedDelaySec=5m\\nUnit=gii-work-backup.service\\n[Install]\\nWantedBy=timers.target\\n\")\nsubprocess.run([\"systemctl\",\"--user\",\"daemon-reload\"],capture_output=True,check=True,timeout=10)\nsubprocess.run([\"systemctl\",\"--user\",\"enable\",\"--now\",\"gii-work-backup.timer\"],capture_output=True,check=True,timeout=10)\nr=subprocess.run([\"/usr/bin/python3\",str(backup)],capture_output=True,text=True,check=True,timeout=20)\nresult=json.loads(r.stdout);print(json.dumps({\"schema\":\"gii.backup-installed.v1\",\"backup\":result,\"timer_enabled\":True,\"reboot_persistence\":\"not_confirmed_linger_no\",\"other_services_changed\":False,\"kimi_accessed\":False}))\n",capture_output=True,text=True,timeout=70)
           print(r.stdout)
           if r.returncode:print("SSH_CONNECTION_FAILED",r.returncode)
           sys.exit(r.returncode)
          finally:
           os.unlink(key);os.unlink(known)
          
          PY
