name: Gii isolated release maintenance 2026-11-11
on:
  push:
    branches: ["gii/isolated-release-20261111"]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Maintain isolated Gii release only
        env:
          KEY_B64: ${{ secrets.AVITO_SERVER_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.AVITO_SERVER_KNOWN_HOSTS }}
          SERVER_HOST: ${{ secrets.AVITO_SERVER_HOST }}
          SERVER_USER: ${{ secrets.AVITO_SERVER_USER }}
          SERVER_PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
        run: |
          python3 - <<'PY'
          import os,base64,subprocess,sys
          root=os.environ["RUNNER_TEMP"]+"/gii-ro"
          os.makedirs(root,mode=0o700,exist_ok=True)
          key=root+"/key";known=root+"/known_hosts"
          for name,value in [(key,base64.b64decode(os.environ["KEY_B64"])),(known,os.environ["KNOWN_HOSTS"].encode())]:
           fd=os.open(name,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
           with os.fdopen(fd,"wb") as f:f.write(value)
          port=os.environ.get("SERVER_PORT") or "22"
          if not port.isdigit():raise SystemExit("invalid_port")
          cmd=["ssh","-F","/dev/null","-4","-T","-o","BatchMode=yes","-o","ConnectTimeout=15","-o","StrictHostKeyChecking=yes","-o","UserKnownHostsFile="+known,"-o","IdentitiesOnly=yes","-i",key,"-p",port,os.environ["SERVER_USER"]+"@"+os.environ["SERVER_HOST"],"python3 -"]
          try:
           r=subprocess.run(cmd,input="\"\"\"Owner-authorized isolated Gii deployment. Never alters pre-existing Gii/Kimi services.\"\"\"\nimport base64, datetime, hashlib, json, os, pathlib, secrets, sqlite3, subprocess, tarfile, time, urllib.request\nROOT=pathlib.Path.home()/'gii-work'\nEXPECTED='227a27d75d36ab49f49df7c00fbeb52968bb1df4074721e4605eaf1da5350726'\nENVELOPE_B64=''\nUNITS=['gii-work-app.service','gii-work-edge.service','gii-work-tunnel.service']\n\ndef main():\n    if (ROOT/'.gii-scope').read_text().strip()!='GII-ONLY-20261111':raise RuntimeError('scope_marker_mismatch')\n    os.umask(0o077)\n    raw=subprocess.run(['openssl','cms','-decrypt','-inform','DER','-recip',str(ROOT/'transport/release-cert.pem'),'-inkey',str(ROOT/'transport/release-key.pem')],input=base64.b64decode(ENVELOPE_B64),capture_output=True,check=True).stdout\n    if hashlib.sha256(raw).hexdigest()!=EXPECTED:raise RuntimeError('release_sha256_mismatch')\n    archive=ROOT/'incoming/Gii_sonar_1.2.0-rc2_2026-11-11.tar.gz'\n    if archive.exists() and hashlib.sha256(archive.read_bytes()).hexdigest()!=EXPECTED:raise RuntimeError('existing_archive_mismatch')\n    archive.write_bytes(raw);archive.chmod(0o600)\n    release=ROOT/'releases/sonar-1.2.0-rc2'\n    if not release.exists():\n        stage=ROOT/'releases'/('unpack-'+secrets.token_hex(6));stage.mkdir(mode=0o700)\n        with tarfile.open(archive) as tf:\n            for member in tf.getmembers():\n                path=stage/member.name\n                if not path.resolve().is_relative_to(stage.resolve()) or not (member.isfile() or member.isdir()):raise RuntimeError('unsafe_archive_member')\n                if member.isdir():path.mkdir(parents=True,exist_ok=True,mode=0o700);continue\n                path.parent.mkdir(parents=True,exist_ok=True,mode=0o700)\n                path.write_bytes(tf.extractfile(member).read());path.chmod(0o600 if member.name.endswith('evaluator/tasks.json') else 0o644)\n        subprocess.run(['/usr/bin/python3',str(stage/'gii.py'),'verify',str(stage)],capture_output=True,check=True,timeout=15)\n        subprocess.run(['/usr/bin/python3',str(stage/'gii.py'),'check','--output',str(ROOT/'logs/release-checks')],capture_output=True,check=True,timeout=45)\n        stage.rename(release)\n    subprocess.run(['/usr/bin/python3',str(release/'gii.py'),'verify',str(release)],capture_output=True,check=True,timeout=15)\n    data=ROOT/'data/sonar-1.2';data.mkdir(mode=0o700,exist_ok=True)\n    envfile=ROOT/'runtime.env'\n    if not envfile.exists():\n        envfile.write_text('GII_DATA='+str(data)+'\\nGII_RUN_ISSUER_TOKEN='+secrets.token_urlsafe(48)+'\\n');envfile.chmod(0o600)\n    runtime=ROOT/'runtime';runtime.mkdir(mode=0o700,exist_ok=True)\n    edge=runtime/'start_edge.py'\n    edge.write_text('import sys\\nsys.path.insert(0,'+repr(str(release/'gii-website'))+')\\nimport staging_edge as edge\\nedge.UPSTREAM_PORT=18769\\nedge.Server((\"127.0.0.1\",18770),edge.Handler).serve_forever()\\n')\n    unitdir=pathlib.Path.home()/'.config/systemd/user';unitdir.mkdir(parents=True,exist_ok=True)\n    for name in UNITS:\n        p=unitdir/name\n        if p.exists() and not p.read_text().startswith('# GII-ONLY-20261111'):raise RuntimeError('unit_name_collision')\n    binary='/opt/gii-sonar-staging/bin/cloudflared'\n    configs={\n      UNITS[0]:('Gii Work Sonar 1.2 rc2',str(release/'gii-website'),'/usr/bin/python3 '+str(release/'gii-website/app.py')+' serve --port 18769','EnvironmentFile='+str(envfile)+'\\n',''),\n      UNITS[1]:('Gii Work isolated edge',str(runtime),'/usr/bin/python3 '+str(edge),'','Requires=gii-work-app.service\\nAfter=gii-work-app.service\\n'),\n      UNITS[2]:('Gii Work isolated HTTPS tunnel',str(runtime),binary+' tunnel --url http://127.0.0.1:18770 --no-autoupdate --protocol http2 --metrics 127.0.0.1:20243','','Requires=gii-work-edge.service\\nAfter=gii-work-edge.service\\n')}\n    for name,(description,cwd,command,environment,dependencies) in configs.items():\n        text='# GII-ONLY-20261111\\n[Unit]\\nDescription='+description+'\\n'+dependencies+'StartLimitIntervalSec=30\\nStartLimitBurst=5\\n[Service]\\nType=simple\\nWorkingDirectory='+cwd+'\\nExecStart='+command+'\\n'+environment+'Restart=on-failure\\nRestartSec=3\\nTimeoutStopSec=15\\nUMask=0077\\nNoNewPrivileges=yes\\nStandardOutput=append:'+str(ROOT/'logs'/name.replace('.service','.log'))+'\\nStandardError=inherit\\n[Install]\\nWantedBy=default.target\\n'\n        (unitdir/name).write_text(text)\n    subprocess.run(['systemctl','--user','daemon-reload'],capture_output=True,check=True,timeout=10)\n    try:\n        subprocess.run(['systemctl','--user','enable','--now',*UNITS],capture_output=True,check=True,timeout=20)\n        checks={}\n        for port in (18769,18770):\n            for attempt in range(20):\n                try:\n                    with urllib.request.urlopen('http://127.0.0.1:'+str(port)+'/health',timeout=2) as response:body=json.load(response)\n                    if body.get('version')!='0.2.1' or body.get('sonar_version')!='1.2.0-rc2':raise RuntimeError('unexpected_version')\n                    checks[str(port)]={'status':200,**body};break\n                except OSError:time.sleep(0.25)\n            else:raise RuntimeError('candidate_health_failed')\n    except Exception:\n        subprocess.run(['systemctl','--user','stop',*reversed(UNITS)],capture_output=True,timeout=20)\n        raise\n    target=ROOT/'backups'/('pre-control-'+datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%dT%H%M%SZ')+'.sqlite3')\n    with sqlite3.connect('file:'+str(data/'gii.sqlite3')+'?mode=ro',uri=True) as source, sqlite3.connect(target) as backup:\n        source.backup(backup)\n        if backup.execute('pragma integrity_check').fetchone()[0]!='ok':raise RuntimeError('backup_integrity_failed')\n        counts={t:backup.execute('select count(*) from '+t).fetchone()[0] for t in ['sonar_runs','sonar_events','sonar_responses','sonar_journal']}\n    journal={'schema':'gii.isolated.deployment.v1','at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'root':str(ROOT),'release_sha256':EXPECTED,'source_commit':'9276616043628b6a2820c71f54334367440c6144','application':'0.2.1','sonar':'1.2.0-rc2','database':str(data/'gii.sqlite3'),'backup':str(target),'backup_sha256':hashlib.sha256(target.read_bytes()).hexdigest(),'backup_integrity':'ok','initial_counts':counts,'health':checks,'new_user_units':UNITS,'existing_services_modified':False,'personal_kimi_accessed':False,'paid_api_calls':0,'model_calls':0,'autostart_limit':'user-manager runs now; linger=no; reboot persistence not confirmed'}\n    (ROOT/'control/deployment.json').write_text(json.dumps(journal,indent=2)+'\\n')\n    print(json.dumps(journal))\n\nif __name__=='__main__':main()\n",capture_output=True,text=True,timeout=70)
           print(r.stdout)
           if r.returncode:print("SSH_CONNECTION_FAILED",r.returncode)
           sys.exit(r.returncode)
          finally:
           os.unlink(key);os.unlink(known)
          
          PY
