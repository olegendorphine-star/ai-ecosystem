name: Gii isolated release maintenance 2026-11-11
on:
  push:
    branches: ["gii/isolated-release-20261111"]
permissions:
  contents: read
jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Gii-only external technical acceptance
        env:
          KEY_B64: ${{ secrets.AVITO_SERVER_SSH_KEY_B64 }}
          KNOWN_HOSTS: ${{ secrets.AVITO_SERVER_KNOWN_HOSTS }}
          SERVER_HOST: ${{ secrets.AVITO_SERVER_HOST }}
          SERVER_USER: ${{ secrets.AVITO_SERVER_USER }}
          SERVER_PORT: ${{ secrets.AVITO_SERVER_SSH_PORT }}
        run: |
          python3 - <<'PY'
          import os,base64,subprocess,sys,json,urllib.request,urllib.error,datetime
          root=os.environ["RUNNER_TEMP"]+"/gii-only-maintenance";os.makedirs(root,mode=0o700,exist_ok=True)
          key=root+"/key";known=root+"/known_hosts"
          for name,value in [(key,base64.b64decode(os.environ["KEY_B64"])),(known,os.environ["KNOWN_HOSTS"].encode())]:
           fd=os.open(name,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
           with os.fdopen(fd,"wb") as f:f.write(value)
          port=os.environ.get("SERVER_PORT") or "22"
          cmd=["ssh","-F","/dev/null","-4","-T","-o","BatchMode=yes","-o","ConnectTimeout=15","-o","StrictHostKeyChecking=yes","-o","UserKnownHostsFile="+known,"-o","IdentitiesOnly=yes","-i",key,"-p",port,os.environ["SERVER_USER"]+"@"+os.environ["SERVER_HOST"],"python3 -"]
          def ssh(script):
           done=subprocess.run(cmd,input=script,capture_output=True,text=True,timeout=65)
           if done.returncode:raise RuntimeError("gii_remote_step_failed")
           return done.stdout
          try:
           run=json.loads(ssh("import os,json,time,urllib.request,datetime\nfrom pathlib import Path\nroot=Path.home()/\"gii-work\";package=root/\"control/external-run.json\"\nfor i in range(20):\n try:\n  with urllib.request.urlopen(\"http://127.0.0.1:20243/quicktunnel\",timeout=2) as r:hostname=json.load(r)[\"hostname\"]\n  if hostname.endswith(\".trycloudflare.com\"):break\n except Exception:time.sleep(0.5)\nelse:raise RuntimeError(\"tunnel_not_ready\")\nbase=\"https://\"+hostname\n(root/\"public-endpoint.txt\").write_text(base+\"\\n\")\nif package.exists():out=json.loads(package.read_text())\nelse:\n env=dict(x.split(\"=\",1) for x in (root/\"runtime.env\").read_text().splitlines() if \"=\" in x)\n body={\"task_id\":\"sonar-1.1-contradictions-01\",\"mode\":\"direct_url\",\"repeat_id\":\"control-1\",\"condition_id\":\"maintenance\",\"metadata\":{\"experiment_id\":\"GII-TECH-CONTROL-20261111\",\"control_only\":True,\"model_measurement\":False,\"external_model_called\":False,\"browser\":\"unobservable\"}}\n req=urllib.request.Request(\"http://127.0.0.1:18770/sonar/run\",data=json.dumps(body).encode(),headers={\"Content-Type\":\"application/json\",\"Origin\":base,\"Host\":hostname,\"X-Gii-Issuer-Token\":env[\"GII_RUN_ISSUER_TOKEN\"]},method=\"POST\")\n with urllib.request.urlopen(req,timeout=5) as r:out=json.load(r)\n out[\"base_url\"]=base;package.write_text(json.dumps(out));package.chmod(0o600)\nout[\"base_url\"]=base\nprint(json.dumps(out))\n"));base=run["base_url"];rid=run["run_id"]
           if not base.startswith("https://") or not base.endswith(".trycloudflare.com"):raise RuntimeError("invalid_endpoint")
           report={"schema":"gii.external-control.v1","at":datetime.datetime.now(datetime.timezone.utc).isoformat(),"base_url":base,"run_id":rid,"mode":"technical_control","model_measurement":False,"external_models_called":0,"paid_api_calls":False,"steps":[]}
           def request(method,path,body=None,headers=None,expected=200):
            req=urllib.request.Request(base+path,data=json.dumps(body).encode() if body is not None else None,method=method,headers={"Content-Type":"application/json",**(headers or {})})
            try:
             response=urllib.request.urlopen(req,timeout=15)
            except urllib.error.HTTPError as error:response=error
            with response:
             raw=response.read(500000);status=response.status
            report["steps"].append({"method":method,"path":path,"status":status,"expected":expected,"passed":status==expected})
            if status!=expected:raise RuntimeError("unexpected_http_status_"+str(status))
            try:return json.loads(raw)
            except ValueError:return {}
           health=request("GET","/health");report["health"]=health
           tasks=request("GET","/sonar/tasks");report["task_count"]=tasks.get("count")
           request("GET","/admin",expected=404);request("GET","/evaluator/tasks.json",expected=404)
           request("GET","/sonar/run/"+rid,headers={"X-Gii-Sonar-Token":run["token"],"X-Gii-Observation-Purpose":"experiment"})
           event={"run_id":rid,"token":run["token"],"seq":0,"event_type":"technical_control_received","event_origin":"server_received_event","payload":{"control_only":True,"browser":"unobservable"}}
           bad={**event,"token":"deliberately-wrong"};request("POST","/sonar/event",bad,expected=401)
           bad={**event,"challenge":"deliberately-wrong"};request("POST","/sonar/event",bad,expected=400)
           request("POST","/sonar/event",{**event,"challenge":run["challenge"]},expected=201)
           request("POST","/sonar/event",event,expected=409)
           body={"run_id":rid,"token":run["token"],"response":"Technical transport control. No model was invoked.","response_origin":"unconfirmed","idempotency_key":"gii-maintenance-control-001","metadata":{"control_only":True,"model_measurement":False}}
           receipt=request("POST","/sonar/response",body,expected=201)
           retry=request("POST","/sonar/response",body,expected=201)
           request("POST","/sonar/response",{**body,"response":"Changed control payload"},expected=409)
           export=request("GET","/sonar/export/"+rid,headers={"X-Gii-Sonar-Token":run["token"]})
           forbidden={"reference_answer","acceptable_answers","critical_errors","counterexample","scoring_rules","leakage_risk"}
           def check(value):
            if isinstance(value,dict):return bool(forbidden.intersection(value)) or any(check(v) for v in value.values())
            if isinstance(value,list):return any(check(v) for v in value)
            return False
           report.update(export_schema=export.get("schema"),run_status=export["run"]["status"],attribution_status=export["run"]["attribution_status"],event_count=len(export["events"]),http_observation_count=len(export["http_observations"]),evaluator_leakage=check(export) or check(tasks),credential_leakage=run["token"] in json.dumps(export),idempotent_receipt_equal=receipt["receipt"]==retry["receipt"],export=export)
           if report["evaluator_leakage"] or report["credential_leakage"] or not report["idempotent_receipt_equal"]:raise RuntimeError("acceptance_failed")
           if report["run_status"]!="completed" or report["event_count"]!=1:raise RuntimeError("wrong_control_counts")
           saved=json.dumps(report,ensure_ascii=False)
           save="import json\nfrom pathlib import Path\np=Path.home()/'gii-work/control/external-smoke.json'\np.write_text("+repr(saved)+")\nprint('saved')\n"
           ssh(save)
           print(json.dumps(report,ensure_ascii=False))
          finally:
           os.unlink(key);os.unlink(known)
          
          PY
