name: Avito — obtain encrypted own profile ID for support
on:
  pull_request:
    paths:
      - 'tools/avito_support_account_id_encrypted.py'
      - 'tools/avito_support_account_public_key.pem'
      - 'tests/test_avito_support_account_id_encrypted.py'
      - '.github/workflows/avito-support-profile-id-once.yml'
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/avito-support-profile-id-once.yml'

permissions:
  contents: read

jobs:
  offline_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test strict ID extraction and encrypted-only report
        run: python3 -m unittest discover -s tests -p 'test_avito_support_account_id_encrypted.py' -v
      - name: Offline mode must be blocked
        run: |
          if python3 tools/avito_support_account_id_encrypted.py --live /tmp/id.json; then
            echo "FAIL_UNAUTHORIZED_LIVE"
            exit 1
          fi

  encrypted_lookup_once:
    needs: offline_tests
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'RUN_ONCE_AVITO_SUPPORT_PROFILE_ID_2026_11_05') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Encrypt own account ID from official Avito API before writing
        id: encrypted
        shell: bash
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          AVITO_ALLOW_SUPPORT_ID_READONLY: YES
        run: |
          set -euo pipefail
          if [[ "$(date -u +%F)" != "2026-11-05" ]]; then
            echo "DATE_EXPIRED_NO_API_REQUEST"
            exit 0
          fi
          python3 tools/avito_support_account_id_encrypted.py --live \
            docs/reports/avito-support-profile-id-encrypted-2026-11-05.json
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Publish ciphertext-only report
        if: ${{ steps.encrypted.outputs.ready == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          path='docs/reports/avito-support-profile-id-encrypted-2026-11-05.json'
          git add -- "$path"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'report: encrypted Avito account identifier for support' || exit 0
          git push origin HEAD:main
