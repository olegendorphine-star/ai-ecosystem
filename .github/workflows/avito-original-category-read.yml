name: Avito recover fields from last successful original feed
on:
  push:
    branches: [ "fix/avito-category-recovery-2026-11-05" ]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Recover accepted category and original Id without editing
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,urllib.error,os,json,xml.etree.ElementTree as ET
          base='https://api.avito.ru'
          body=urllib.parse.urlencode({'grant_type':'client_credentials','client_id':os.environ['AVITO_CLIENT_ID'],'client_secret':os.environ['AVITO_CLIENT_SECRET']}).encode()
          with urllib.request.urlopen(urllib.request.Request(base+'/token/',data=body,headers={'Content-Type':'application/x-www-form-urlencoded'},method='POST'),timeout=25) as r:
              token=json.load(r)['access_token']
          h={'Authorization':'Bearer '+token,'Accept':'application/json'}
          with urllib.request.urlopen(urllib.request.Request(base+'/autoload/v4/uploads/last_successful',headers=h),timeout=25) as r:
              last=json.load(r)
          print('last_upload',last.get('upload_id'),'status',last.get('status'))
          allowed={'Id','AvitoId','Category','ServiceType','ServiceTypes','ServiceSubcategory','GoodsType','BusinessType','AdType','OperationType','Service','CategoryId','ServiceCategory','ProductType'}
          for info in last.get('feed_urls',[]):
              url=info.get('url')
              try:
                  req=urllib.request.Request(url,headers=h)
                  with urllib.request.urlopen(req,timeout=25) as r:
                      data=r.read()
                      print('feed_bytes',len(data),'content_type',r.headers.get('Content-Type'))
                  root=ET.fromstring(data)
                  print('root_tag',root.tag)
                  ads=root.findall('Ad') or list(root)[:3]
                  for ad in ads[:5]:
                      print('ad_fields',[(x.tag,(x.text or '')[:120]) for x in ad if x.tag in allowed])
                      print('ad_tags',[x.tag for x in ad])
                      protected={'Title','Description','Id','Images','ContactPhone','ManagerName'}
                      print('ad_operational_fields',[(x.tag,(x.text or '')[:250]) for x in ad if x.tag not in protected])
                      print('photo_count',len(ad.findall('./Images/Image')))
                      print('photo_sources',[(u.attrib.get('url','')[:160],u.attrib.get('name','')) for u in ad.findall('./Images/Image')])
              except Exception as err:
                  print('feed_read_error',type(err).__name__)
          PY
