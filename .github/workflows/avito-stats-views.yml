name: Avito daily views — safe read-only report
on:
  pull_request:
    paths:
      - 'tools/avito_stats_views_report.py'
      - 'tests/test_avito_stats_views_report.py'
      - '.github/workflows/avito-stats-views.yml'
  push:
    branches: ['main']
    paths:
      - '.github/workflows/avito-stats-views.yml'
  schedule:
    - cron: '17 3 * * *' # UTC, daily
  workflow_dispatch:
    inputs:
      approve_readonly:
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  offline_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_avito_stats_views_report.py' -v
  live_views:
    needs: offline_tests
    if: ${{ ((github.event_name == 'schedule' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.approve_readonly == true && github.ref == 'refs/heads/main')) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'RUN_ONCE_AVITO_STATS_VIEWS_2026_11_12')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Views for five confirmed public listing IDs
        env:
          AVITO_CLIENT_ID: ${{ secrets.AVITO_CLIENT_ID }}
          AVITO_CLIENT_SECRET: ${{ secrets.AVITO_CLIENT_SECRET }}
          AVITO_ALLOW_STATS_READONLY: 'YES'
          AVITO_STATS_REPORT_FILE: 'reports/avito-views-latest.json'
        run: |
          if [[ "${{ github.event_name }}" == "push" && "$(date -u +%F)" != "2026-11-12" ]]; then
            echo ONE_SHOT_EXPIRED
            exit 0
          fi
          python3 -m tools.avito_stats_views_report
      - name: Store dated read-only report as artifact
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: avito-views-${{ github.run_id }}
          path: reports/avito-views-latest.json
          retention-days: 90
          if-no-files-found: error
